name: monthly coach

# The monthly coach, checklist only (the owner's approval of 3 Oct 2026, with
# conditions; docs/research/monthly-coach-plan.md). On the first working day
# of each month, Sunday to Thursday, from Sunday 1 November 2026 (the owner's
# decision of 3 Oct 2026) it sends the owner's phone a short
# checklist: fixed words from coach/checklist.py and the experiment's next
# checkpoint date, which is already public in logs/race_gate.json.
#
# No personal number goes anywhere: the checklist asks for none, this job
# reads none, holds no key but the phone topic, asks no model and commits
# nothing. The private data entry (a private Supabase project, the model
# seeing percentages only, $0.10 a month) is not built until the owner says
# so.
on:
  schedule:
    # The 1st, 2nd and 3rd at 06:10 UTC: one of them is the month's first
    # Sunday-to-Thursday, and coach/checklist.py sends only on that one.
    - cron: "10 6 1-3 * *"
  workflow_dispatch:
    inputs:
      send:
        description: "Send this month's checklist to the phone now, even if today is not the first working day"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monthly-coach
  cancel-in-progress: false

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Make this month's checklist
        id: make
        # Standard library only, so no dependencies to install.
        env:
          FORCE: ${{ inputs.send }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          python -m coach.checklist $ARGS > "$RUNNER_TEMP/coach.json"
          cat "$RUNNER_TEMP/coach.json"
          send=$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("yes" if "message" in d else "no")' "$RUNNER_TEMP/coach.json")
          echo "send=$send" >> "$GITHUB_OUTPUT"

      - name: Send it to the owner's phone
        # The shape of every push in this repository: the topic only in the
        # JSON body, never in a URL or a log; the file that carried it
        # removed. The message is the checklist's fixed words and the public
        # checkpoint date.
        if: steps.make.outputs.send == 'yes'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - "$RUNNER_TEMP/coach.json" <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os, sys
          made = json.load(open(sys.argv[1]))
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": made["title"],
                            "message": made["message"], "priority": 2, "tags": ["calendar"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac
