name: model compare

# Could something cheaper answer the question that decides what is traded?
#
# Run by hand. This is NOT the screening check: that one grades a candidate
# for the cheap first pass, whose worst case is a trade not taken. This grades
# a candidate for the FULL model, whose worst case is a position opened on the
# wrong side. The two have different floors and different consequences, and
# compare_models.py's own docstring says so at length -- read it before
# reading a number out of this.
#
# It makes one call per journal line against the candidate, and prices both
# sides from the API's own token counts. No orders, no journal written.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Candidate model at the endpoint, e.g. openai/gpt-oss-120b"
        required: true
      effort:
        description: "Reasoning effort to ask it for"
        type: choice
        options: ["high", "medium", "low"]
        default: "high"
      limit:
        description: "Journal lines to grade against (469 recorded; 40 cannot separate 97% from 90%)"
        default: "250"
      concurrency:
        description: "Calls in flight at once. Lower it if the report blames timeouts or 429s on us."
        default: "8"
      timeout:
        description: "Per-call timeout, seconds. Raise it with concurrency lowered -- a timeout picks which contexts get graded."
        default: "120"
      base_url:
        description: "OpenAI-compatible endpoint"
        default: "https://api.deepinfra.com/v1/openai"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    # Same reasoning as the screening check: one call per journal line at a
    # reasoning effort, which is minutes per dozen rather than seconds.
    # 250 contexts three or four at a time, each allowed several minutes, is
    # hours -- and that combination is the point: a cheap deadline decides
    # which contexts get graded, so buying an honest sample means paying the
    # wall time. Six hours is the ceiling GitHub allows a hosted job.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Could this answer the question Opus answers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_KEY: ${{ secrets.SCREENING_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          python replay/compare_models.py \
            --base-url "${{ inputs.base_url }}" \
            --only "${{ inputs.model }}:${{ inputs.effort }}" \
            --api-key "$CANDIDATE_KEY" \
            --limit "${{ inputs.limit }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --timeout "${{ inputs.timeout }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
