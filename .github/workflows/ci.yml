name: CI

on:
  # Pushes to a branch with an open PR are covered by the pull_request
  # trigger; listing "**" here as well would run the whole matrix twice for
  # every commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # Deliberately run with no credentials and no network: every test uses
        # the fakes in tests/conftest.py. If a test ever needs a real Alpaca
        # key or a live quote, that is a bug in the test, not in this workflow.
        run: pytest tests/ -v

      - name: App imports without credentials
        # Guards the lazy-construction property: importing app.main must not
        # reach for Alpaca keys or the network.
        run: python -c "from app.main import app; app.openapi()"

  guardrails:
    name: guardrail invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Alpaca SDK is imported only by broker_client.py
        run: |
          hits=$(grep -rnE '^[[:space:]]*(import|from)[[:space:]]+alpaca' \
                   app orchestrator config analysis store --include='*.py' \
                 | grep -v '^app/broker_client.py:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Alpaca SDK imported outside app/broker_client.py"
            exit 1
          fi
          echo "OK: only broker_client.py imports the Alpaca SDK"

      - name: API keys are read only by broker_client.py
        # config/settings.py declares the fields; only broker_client may read
        # their values.
        run: |
          hits=$(grep -rnE '\.(alpaca_api_key|alpaca_secret_key)\b' \
                   app orchestrator analysis store --include='*.py' \
                 | grep -v '^app/broker_client.py:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Alpaca credentials read outside app/broker_client.py"
            exit 1
          fi
          echo "OK: only broker_client.py reads the API keys"

      - name: Position exits are close-only, and only the broker client can make them
        # The profit ladder sells part of a winning position. The only way it
        # may do so is Alpaca's own close-position endpoint, which reduces a
        # position and cannot open, add to or reverse one -- so the rule that
        # every entry is a bracket with a stop is not weakened by exits.
        # Two things guard that: the close and replace calls exist in exactly
        # one file, and a market order without a stop_loss is still never
        # constructed anywhere.
        run: |
          hits=$(grep -rnE '\.(close_position|replace_order_by_id|close_all_positions|cancel_orders)\(' \
                   app orchestrator config analysis store backtest replay --include='*.py' \
                 | grep -v '^app/broker_client.py:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a position-changing broker call exists outside app/broker_client.py"
            exit 1
          fi
          if grep -rnE 'close_all_positions|cancel_orders' app/broker_client.py; then
            echo "::error::broker_client.py must not be able to flatten the book or cancel every order"
            exit 1
          fi
          # A standalone stop is the fourth primitive, and it is close-only
          # only because broker_client.py reads the book and refuses anything
          # that is not a reduction. So it, too, may be built in one file only.
          stops=$(grep -rnE 'StopOrderRequest\(' \
                    app orchestrator config analysis store backtest replay learn --include='*.py' \
                  | grep -v '^app/broker_client.py:' || true)
          if [ -n "$stops" ]; then
            echo "$stops"
            echo "::error::a stop order is constructed outside app/broker_client.py"
            exit 1
          fi
          if ! grep -qE 'time_in_force=TimeInForce\.GTC' app/broker_client.py \
             || grep -qE 'time_in_force=TimeInForce\.DAY' app/broker_client.py; then
            echo "::error::every stop must be good-till-cancelled; a DAY stop dies at the close and protects nothing overnight"
            exit 1
          fi
          naked=$(grep -rnE 'MarketOrderRequest\(' app --include='*.py' | grep -v 'stop_loss' || true)
          # The request is built across lines; check the constructor's block carries stop_loss.
          if ! grep -qE 'stop_loss=StopLossRequest' app/broker_client.py; then
            echo "::error::the entry order no longer attaches a StopLossRequest"
            exit 1
          fi
          echo "OK: exits are close-only, and only broker_client.py can make them"

      - name: Live trading is not reachable from configuration
        run: |
          if ! grep -q 'paper=True,' app/broker_client.py; then
            echo "::error::paper=True is no longer hard-coded in broker_client.py"
            exit 1
          fi
          hits=$(grep -rnE 'paper[[:space:]]*=' app --include='*.py' \
                 | grep -vE 'paper=True' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::found a paper= argument that is not the literal True"
            exit 1
          fi
          if ! grep -q 'live_trade' app/broker_client.py; then
            echo "::error::the live-profile refusal is gone from broker_client.py"
            exit 1
          fi
          echo "OK: paper=True is hard-coded and live CLI profiles are refused"

      - name: A closed market cannot be traded into
        # The engine gate is the safety property, not the scheduler's skip:
        # a signal replayed by hand or delivered late must not open a
        # position into a closed session.
        run: |
          if ! grep -q 'is_market_open' app/execution_engine.py; then
            echo "::error::the market-hours gate is gone from execution_engine.py"
            exit 1
          fi
          echo "OK: the engine checks market hours"

      - name: Direct mode keeps the closed signal shape
        # Removing the webhook removed an HTTP boundary, not the schema one.
        # The dispatcher must hand the engine an LLMSignal and nothing else.
        run: |
          hits=$(grep -rnE '(model_construct|\.__dict__|setattr\()' orchestrator/dispatch.py || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::dispatch.py must not bypass LLMSignal validation"
            exit 1
          fi
          echo "OK: direct mode cannot bypass the signal schema"

      - name: Guardrail thresholds are not environment-overridable
        # The whole point of config/settings.py is that MAX_POSITION_PCT and
        # friends are Final constants a bad .env cannot loosen.
        run: |
          for const in MAX_POSITION_PCT MIN_CONVICTION MAX_OPEN_POSITIONS ATR_STOP_MULTIPLIER; do
            if ! grep -qE "^${const}: Final" config/settings.py; then
              echo "::error::${const} is no longer a Final module constant"
              exit 1
            fi
          done
          if grep -nE '(os\.environ|getenv)' config/settings.py; then
            echo "::error::config/settings.py reads the environment directly"
            exit 1
          fi
          echo "OK: guardrail thresholds are Final constants"

      - name: LLM transparency fields never reach the decision path
        # The signal carries per-dimension scores and key_factors so a call can
        # be audited later. Widening what the LLM may say is only safe while
        # the extra words stay inert: bias and conviction are the only fields
        # the engine may act on.
        run: |
          hits=$(grep -rnE '\b([a-z_]+_score|key_factors|blend[a-z_]*|composite)\b' \
                   app/execution_engine.py app/risk_engine.py app/broker_client.py orchestrator/dispatch.py || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a transparency field is referenced in the execution path"
            exit 1
          fi
          echo "OK: scores, key_factors and the blend are inert"

      - name: The learned blend runs in shadow
        # orchestrator/blend.py computes a composite of the five scores and the
        # journal records it. Until the walk-forward report has shown, on
        # realised returns, that the composite beats the model's own
        # conviction, it must not be able to touch a trade: the mode is pinned
        # to shadow, and the only orchestrator module that may read what the
        # blend produced is the journal that writes it down.
        run: |
          if ! grep -qE '^BLEND_MODE: Final\[str\] = "shadow"$' config/settings.py; then
            echo "::error::BLEND_MODE must be the Final constant \"shadow\" until the report says otherwise"
            exit 1
          fi
          hits=$(grep -rnE 'blend_signal|blend_record|\bcomposite\b' \
                   orchestrator --include='*.py' \
                 | grep -vE '^orchestrator/(blend|heartbeat|journal)\.py:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::the blend's output is read outside the modules that compute and journal it"
            exit 1
          fi
          if grep -nE 'post_signal\([^)]*blend' orchestrator/heartbeat.py; then
            echo "::error::the blend must not be handed to post_signal"
            exit 1
          fi
          echo "OK: the blend is shadow-only"

      - name: The trainer writes one file and cannot trade
        # learn/ reads the journal and writes the weights the next cycle will
        # apply. That makes it the one package that feeds the cycle from
        # outside it, so it is held to the same rules as the scorer plus one:
        # no order path, exactly one write (the weights file, in one named
        # function), and the orchestrator never imports it -- a cycle applies
        # weights, it never fits them.
        run: |
          hits=$(grep -rnE '(submit_order|submit_bracket_order|ExecutionEngine|post_signal|AlpacaPaperBroker)' \
                   learn --include='*.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::learn/ must not place orders"
            exit 1
          fi
          python3 - <<'PY'
          import ast, pathlib, sys
          writes = []
          for path in sorted(pathlib.Path("learn").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if not isinstance(node, ast.FunctionDef):
                      continue
                  for call in ast.walk(node):
                      if not isinstance(call, ast.Call):
                          continue
                      name = getattr(call.func, "attr", getattr(call.func, "id", ""))
                      if name in ("write_text", "write_bytes", "unlink", "rmtree") or (
                          name == "open" and len(call.args) > 1
                          and isinstance(call.args[1], ast.Constant)
                          and any(ch in str(call.args[1].value) for ch in "wax")
                      ):
                          writes.append(f"{path}:{call.lineno} in {node.name}")
          if len(writes) != 1 or not writes[0].startswith("learn/fit_weights.py:") or not writes[0].endswith(" in write_artifact"):
              print("\n".join(writes) or "no write found")
              sys.exit("::error::learn/ may write exactly once, in fit_weights.write_artifact")
          for path in sorted(pathlib.Path("orchestrator").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  names = [a.name for a in node.names] if isinstance(node, ast.Import) else \
                          [node.module or ""] if isinstance(node, ast.ImportFrom) else []
                  if any(n == "learn" or n.startswith("learn.") for n in names):
                      sys.exit(f"::error::{path}:{node.lineno} imports learn/ -- the cycle applies weights, it never fits them")
          print("OK: the trainer writes one file, cannot trade, and is unreachable from the cycle")
          PY

      - name: Instrument kind is never taken from the signal
        # An ETF's position cap is four times a single name's. That makes the
        # classification a privilege boundary: if a model could assert its own
        # instrument kind, it could quadruple its position by claiming one.
        #
        # Two halves. First, the schema stays closed to anything kind-shaped,
        # so there is no field to smuggle it through -- extra="forbid" already
        # rejects unknown keys, and this stops one being *added*. Second, the
        # cap constant is readable only where it is defined and applied, so a
        # future caller cannot select it from signal content.
        run: |
          schema=$(grep -nE '^\s+(instrument|asset_class|kind|is_etf|security_type)\b' \
                     app/schemas.py || true)
          if [ -n "$schema" ]; then
            echo "$schema"
            echo "::error::LLMSignal must not carry an instrument-kind field"
            exit 1
          fi
          hits=$(grep -rnE 'MAX_(BROAD_FUND|COMMODITY_FUND)_PCT' --include='*.py' \
                   app orchestrator config \
                 | grep -vE '^(config/settings\.py|app/risk_engine\.py):' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a fund cap may only be read by risk_engine.max_position_pct_for"
            exit 1
          fi
          # Stdlib only: this job installs no dependencies, so a check that
          # imports the app cannot run here. Reading the source is the
          # stronger check anyway -- it holds even when the app does not
          # import.
          python3 - <<'PY'
          import ast, sys
          BANNED = {"instrument", "instrument_kind", "asset_class", "kind",
                    "is_etf", "security_type"}
          tree = ast.parse(open("app/schemas.py").read())
          signal = next((n for n in ast.walk(tree)
                         if isinstance(n, ast.ClassDef) and n.name == "LLMSignal"), None)
          if signal is None:
              sys.exit("::error::LLMSignal not found in app/schemas.py")
          fields = {t.target.id for t in signal.body
                    if isinstance(t, ast.AnnAssign) and isinstance(t.target, ast.Name)}
          leaked = sorted(fields & BANNED)
          if leaked:
              sys.exit(f"::error::LLMSignal carries an instrument-kind field: {', '.join(leaked)}")
          # extra="forbid" is what makes the field set closed. Without it an
          # invented key would be ignored rather than rejected, and the list
          # above would only be as good as our imagination.
          config = next((a.value for a in signal.body
                         if isinstance(a, ast.Assign)
                         and any(getattr(t, "id", "") == "model_config" for t in a.targets)), None)
          forbids = isinstance(config, ast.Call) and any(
              kw.arg == "extra" and getattr(kw.value, "value", None) == "forbid"
              for kw in config.keywords)
          if not forbids:
              sys.exit('::error::LLMSignal must set extra="forbid" to stay a closed field set')
          print("OK: no signal field can declare an instrument kind")
          PY

      - name: Portfolio exposure is bounded on three axes
        # The per-ticker caps do not bound the portfolio, and the gross cap
        # alone does not bound *concentration*: five technology names were
        # five accepted positions and one bet, with every per-ticker cap
        # satisfied. Three checks span every holding -- gross, exposure group,
        # and sleeve budget -- and all three must run on the execution path,
        # not merely exist in risk_engine.
        run: |
          grep -q 'budget_ceiling_for' app/execution_engine.py || {
            echo "::error::execution engine does not call budget_ceiling_for"
            exit 1
          }
          # Follow the chain rather than grepping for a constant: the three
          # limits are applied through budget_ceiling_for, so checking that
          # execution_engine mentions MAX_GROSS_EXPOSURE_PCT would only test
          # where the symbol happens to live today.
          python3 - <<'PY'
          import ast, sys
          src = open("app/risk_engine.py").read()
          tree = ast.parse(src)
          fn = next((n for n in tree.body
                     if isinstance(n, ast.FunctionDef) and n.name == "budget_ceiling_for"), None)
          if fn is None:
              sys.exit("::error::risk_engine.budget_ceiling_for is missing")
          called = {n.func.id for n in ast.walk(fn)
                    if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)}
          for required in ("gross_exposure_headroom", "exposure_group_headroom",
                           "sleeve_headroom"):
              if required not in called:
                  sys.exit(f"::error::budget_ceiling_for does not apply {required}")
          print("OK: all three exposure limits reach the execution path")
          PY
          # Stdlib only, and reading the literals rather than importing:
          # config/settings.py imports pydantic, which this job does not have.
          python3 - <<'PY'
          import ast, sys
          WANTED = ("MAX_POSITION_PCT", "MAX_BROAD_FUND_PCT", "MAX_COMMODITY_FUND_PCT",
                    "MAX_EXPOSURE_GROUP_PCT", "MAX_SINGLE_NAME_SLEEVE_PCT",
                    "MAX_FUND_SLEEVE_PCT", "MAX_GROSS_EXPOSURE_PCT")
          tree = ast.parse(open("config/settings.py").read())
          caps = {n.target.id: n.value.value for n in tree.body
                  if isinstance(n, ast.AnnAssign) and isinstance(n.target, ast.Name)
                  and n.target.id in WANTED and isinstance(n.value, ast.Constant)}
          missing = [name for name in WANTED if name not in caps]
          if missing:
              sys.exit(f"::error::cap constants not found as literals: {', '.join(missing)}")
          single, broad, commodity, group, name_sleeve, fund_sleeve, gross = (
              caps[n] for n in WANTED)
          if not 0 < gross < 1:
              sys.exit(f"::error::gross cap {gross} must leave a cash floor")
          if max(single, broad, commodity) > group:
              sys.exit("::error::one position could consume a whole exposure group")
          if group > gross:
              sys.exit("::error::a single group could consume the whole portfolio")
          # A fund tracking one commodity is not diversified: coffee is one
          # thing. Sizing it like a broad basket would be picking a cap by
          # label rather than by risk.
          if commodity >= broad:
              sys.exit("::error::a single-commodity fund must be capped below a broad fund")
          if commodity >= single:
              sys.exit("::error::a single-commodity fund must be capped below a single name")
          # Risk per trade scales as cap/volatility. A broad fund is typically
          # 1.5-2x quieter than a single name, so a ratio far above that is
          # leverage rather than diversification.
          if broad / single > 2.5:
              sys.exit(f"::error::broad-fund cap is {broad / single:g}x the single-name cap")
          # Funds are the core holding; names are the satellite.
          if fund_sleeve <= name_sleeve:
              sys.exit("::error::the fund sleeve must be the larger budget")
          if abs((name_sleeve + fund_sleeve) - gross) > 1e-9:
              sys.exit("::error::sleeve budgets must sum to the gross cap")
          print(f"OK: {single:.0%}/{broad:.0%}/{commodity:.0%} per position, "
                f"{group:.0%} per group, {name_sleeve:.0%}+{fund_sleeve:.0%} sleeves, "
                f"{gross:.0%} gross")
          PY

      - name: Market context carries no credentials
        # yfinance is unauthenticated. If the enrichment modules ever start
        # reading a secret, they stop being safe to run beside the LLM.
        # dispatch.py is exempt for the same reason as news/llm: it is a
        # delivery module that legitimately carries the webhook secret, not
        # a context source.
        #
        # Stated as an exclusion rather than a file list: only heartbeat.py
        # (webhook + watchlist), news.py (Bright Data) and llm.py (Anthropic)
        # may read a credential, and every other orchestrator module is
        # checked. A list would have to be extended by hand for each new
        # context source, which is a check that fails open -- exactly how
        # insiders.py went uncovered when it was added.
        #
        # sources.py joined this list rather than four modules joining it.
        # Four free data sources need a key, and the choice was between four
        # files that each read the environment or one that does it for all of
        # them. One is auditable; four is a list that grows. The parsing
        # modules stay pure, and a test asserts from the inside that they
        # contain no environment read, no HTTP client and no key at all, so
        # the reason survives a rewrite of this grep.
        #
        # Matches credential *reads* -- a settings lookup, an environment
        # read, or attribute access on a credential-shaped name -- rather
        # than any line mentioning the word, so prose about prompt tokens in
        # a comment is not a build failure.
        run: |
          hits=$(grep -rnE '(get_settings|os\.environ|getenv|\bsettings\.|\.[A-Za-z_]*(secret|api_key|_token|password)\b)' \
                   orchestrator --include='*.py' \
                 | grep -vE '^orchestrator/(heartbeat|news|llm|dispatch|sources)\.py:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::market context modules must not read credentials"
            exit 1
          fi
          echo "OK: market context needs no credentials"

      - name: The one module that holds a key cannot put it in a prompt
        # sources.py is allowed to read credentials. This is the other half of
        # that permission: it may fetch and nothing else. It must not render
        # prompt text, and it must not write files.
        #
        # The stake is concrete. The signal journal is committed back to this
        # repository every cycle, so a key that reached a snapshot would reach
        # a prompt and then a public git history, where it cannot be recalled.
        run: |
          hits=$(grep -nE '(as_lines|as_prompt|as_dict|\.write_text\(|open\([^)]*["'"'"'][wa])' \
                   orchestrator/sources.py || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::orchestrator/sources.py must only fetch: no rendering, no writing"
            exit 1
          fi
          echo "OK: the credentialed module only fetches"

      - name: The scorer is read-only
        # analysis/ grades past decisions. It must never be able to make one:
        # no order path, and no writing to the journal it is reading.
        run: |
          hits=$(grep -rnE '(submit_order|submit_bracket_order|ExecutionEngine|post_signal|\.write_text\(|open\([^)]*["'"'"'][wa])' \
                   analysis --include='*.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::analysis/ must not place orders or write files"
            exit 1
          fi
          echo "OK: the scorer only reads"

      - name: The backtest cannot trade
        # backtest/ replays the risk engine's arithmetic over historical bars.
        # It reuses calculate_stop_price and calculate_position_size on
        # purpose -- measuring a reimplementation would measure the wrong
        # code -- but it must never reach a broker.
        run: |
          hits=$(grep -rnE '(submit_order|submit_bracket_order|ExecutionEngine|post_signal|AlpacaPaperBroker)' \
                   backtest --include='*.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::backtest/ must not place orders"
            exit 1
          fi
          echo "OK: the backtest only simulates"

      - name: The replay harness cannot trade
        # replay/ re-asks the model while iterating on a prompt, so it runs
        # often and casually. It must not be able to place an order, and it
        # must not write the journal it reads -- appending replayed signals
        # would corrupt the only record of what the model actually said.
        run: |
          hits=$(grep -rnE '(submit_order|submit_bracket_order|ExecutionEngine|post_signal|AlpacaPaperBroker|\.write_text\(|open\([^)]*["'"'"'][wa])' \
                   replay --include='*.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::replay/ must not place orders or write files"
            exit 1
          fi
          echo "OK: the replay harness only reads and asks"

      - name: The index cannot trade, and cannot rewrite what it indexes
        # store/ is the only package here that writes anything, which is
        # exactly why it needs a boundary. It builds a derived SQLite index
        # over the two log files. It must not reach a broker, and it must not
        # write the logs it reads -- an index that can edit its own source is
        # not an index, it is a second, unreviewed way to change the record of
        # what was decided.
        run: |
          hits=$(grep -rnE '(submit_order|submit_bracket_order|ExecutionEngine|post_signal|AlpacaPaperBroker)' \
                   store --include='*.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::store/ must not place orders"
            exit 1
          fi
          # The log paths may be read and opened, but never for writing. The
          # loader takes an iterable of lines; nothing in it needs a mode.
          hits=$(grep -rnE "(\.write_text\(|\.unlink\(\)|open\([^)]*['\"][wa])" \
                   store --include='*.py' \
                 | grep -vE "^store/build_db\.py:" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::store/ may only write through sqlite3, not the filesystem"
            exit 1
          fi
          # build_db.py is the one exception, and only for --rebuild, which
          # deletes the database. Check it cannot delete anything else.
          python3 - <<'PY'
          import ast, sys
          tree = ast.parse(open("store/build_db.py").read())
          for node in ast.walk(tree):
              if not (isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)):
                  continue
              if node.func.attr != "unlink":
                  continue
              # Every unlink must be reached from args.db, directly or through
              # one of its WAL sidecars.
              source = ast.unparse(node.func.value)
              if not (source.startswith("args.db") or source == "sidecar"):
                  sys.exit(f"::error::build_db.py unlinks something that is not the database: {source}")
          print("OK: the index writes only its own database")
          PY

      - name: The scorer reaches the index read-only
        # analysis/ may now read from the database as well as the log file, and
        # a plain sqlite3.connect() CREATES the file it is pointed at. That
        # would make the scorer a writer through a door the grep above does not
        # watch, and leave an empty database behind as the evidence. Every
        # connection opened from analysis/ must use the read-only URI.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for path in sorted(pathlib.Path("analysis").rglob("*.py")):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if "sqlite3.connect(" not in line:
                      continue
                  if "mode=ro" not in line:
                      bad.append(f"{path}:{number}: {line.strip()}")
          if bad:
              print("\n".join(bad))
              sys.exit("::error::analysis/ must open SQLite with mode=ro")
          print("OK: the scorer cannot create or write a database")
          PY

      - name: The Supabase key has exactly one reader
        # Same rule the broker credential lives under: a secret with one reader
        # is one whose blast radius can be reasoned about. config/settings.py
        # DECLARES the fields; only store/remote.py may read their values, and
        # everything else goes through RemoteArchive.from_settings().
        #
        # This key bypasses row-level security by design -- that is what lets
        # the remote tables keep RLS on with no policies, so the publishable
        # key can do nothing at all. The cost of that design is that this key
        # must not spread.
        #
        # Matches attribute ACCESS (`settings.supabase_service_key`) rather
        # than the bare word, so the help text in push_remote.py naming the
        # environment variables is not a build failure. The first version of
        # this check did fail on exactly that.
        run: |
          hits=$(grep -rnE '\.(supabase_url|supabase_service_key)\b' \
                   app orchestrator analysis store backtest replay config learn --include='*.py' \
                 | grep -vE '^(store/remote\.py|config/settings\.py):' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::the Supabase key may only be read by store/remote.py"
            exit 1
          fi
          echo "OK: one reader for the Supabase key"

      - name: The remote push is unreachable from the trading cycle
        # The journal must not be able to fail a cycle -- that is why
        # journal.py catches its own exceptions, and why a CI check already
        # forbids orchestrator/ from reading a credential. A network call is a
        # thing that fails, so the push lives outside the cycle entirely: the
        # heartbeat writes its lines, and a LATER workflow step copies them up.
        #
        # Checked structurally rather than by intent: if orchestrator/ cannot
        # import store/, the push cannot be called from the cycle by accident.
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in sorted(pathlib.Path("orchestrator").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      if name == "store" or name.startswith("store."):
                          bad.append(f"{path}:{node.lineno}: imports {name}")
          if bad:
              print("\n".join(bad))
              sys.exit("::error::orchestrator/ must not import store/ -- the push stays outside the cycle")
          print("OK: the trading cycle cannot reach the remote push")
          PY

      - name: A piped script cannot report a false green
        # `python foo.py | tee out.txt` exits with tee's status, not the
        # script's, so a script that exited 1 still shows a green step. The
        # market-checks workflow shipped with exactly that bug and reported
        # success while every one of 36 tickers failed to resolve.
        #
        # Any workflow step that pipes into tee must set -o pipefail first.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def sets_pipefail(line):
              """An actual `set` command, not prose about one.

              The first version of this check searched the whole block for the
              string "set -o pipefail" -- and passed on a block whose only
              occurrence was the comment explaining why pipefail matters. A
              check that its own documentation satisfies is not a check.
              """
              stripped = line.strip()
              if stripped.startswith("#"):
                  return False
              return bool(re.match(r"set\s+-[a-z]*o\s+pipefail\b", stripped)
                          or re.match(r"set\s+-[a-zA-Z]*e?o?\s*pipefail\b", stripped))

          def pipes_to_tee(line):
              """A real shell pipe into tee, not a mention of one.

              Quoted substrings are stripped first, so this checker's own
              source -- which contains the pattern as a string literal -- does
              not flag itself.
              """
              stripped = line.strip()
              if stripped.startswith("#"):
                  return False
              unquoted = re.sub(r"""(['"]).*?\1""", "", stripped)
              return bool(re.search(r"\|\s*tee\b", unquoted))

          bad = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              for block in re.split(r"\n\s*- name:", path.read_text()):
                  lines = block.splitlines()
                  pipes = [i for i, l in enumerate(lines) if pipes_to_tee(l)]
                  if not pipes:
                      continue
                  if not any(sets_pipefail(l) for l in lines[:max(pipes)]):
                      bad.append(f"{path.name}: {block.strip().splitlines()[0][:60]}")
          if bad:
              print("\n".join(bad))
              sys.exit("::error::a step pipes into tee without `set -o pipefail`")
          print("OK: no step can mask a failing script behind tee")
          PY

      - name: No committed .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git"
            exit 1
          fi
          echo "OK: .env is not tracked"
