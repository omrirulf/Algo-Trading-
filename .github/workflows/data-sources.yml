name: data sources

# Does every source the prompt depends on still answer, and answer sanely?
#
# Separate from `market checks` on purpose. That workflow replays two years of
# bars and takes twenty minutes; this one asks a much smaller question that
# needs answering far more often, and answers it in about one. Keeping them
# together meant a data question could only be asked at the price of a
# backtest, so in practice it was not asked.
#
# None of this can run in a development container -- CFTC and Yahoo are both
# unreachable from there -- which is the whole reason it lives on a runner.
# Nothing here needs a credential: yfinance and the CFTC's Socrata endpoint
# are unauthenticated, no LLM is called, and no order is ever placed.
on:
  schedule:
    # Every trading day, forty-five minutes before the cycle's 15:05 UTC cron
    # (GitHub delivers a cron late, not early). Daily rather than weekly
    # because a source that dies on Monday must not feed the model blanks
    # until the following week's check; the whole run costs about a minute.
    - cron: '20 14 * * 1-5'
  workflow_dispatch:
    inputs:
      raw:
        description: "Also dump the untouched Yahoo JSON behind the fund block"
        type: boolean
        default: false
      tickers:
        description: "Funds to probe (space separated, blank for the default set)"
        default: ""

permissions:
  contents: read            # reads public data, writes nothing back
  issues: write             # only to open the one issue that says a source died

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Do the keyed sources answer, and under which name
        # Four free keys, and the single most likely way this goes wrong is a
        # key stored under a name nothing reads -- which is silent, because an
        # absent key is a legitimate state everywhere else in this system.
        #
        # Every plausible spelling is passed through and the script reports
        # which one carried each key. A secret that does not exist becomes an
        # empty string here, which is exactly the "not set" case.
        #
        # The script never prints a key, and scrubs any that an error body
        # echoes back, because this output is uploaded as an artifact.
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}
          EIA_TOKEN: ${{ secrets.EIA_TOKEN }}
          USDA_NASS_KEY: ${{ secrets.USDA_NASS_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          USDA_KEY: ${{ secrets.USDA_KEY }}
          NASS_KEY: ${{ secrets.NASS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          FRED_TOKEN: ${{ secrets.FRED_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set -o pipefail
          python backtest/probe_keyed_sources.py | tee keys.txt

      - name: CFTC positioning answers
        # The weekly Commitments of Traders report is the one source here with
        # no fallback: if the endpoint or the contract names move, the
        # positioning block silently empties and nothing else notices.
        run: |
          set -o pipefail
          python - <<'EOF' | tee positioning.txt
          from orchestrator import positioning

          ok = broken = 0
          for ticker in sorted(positioning.CONTRACTS):
              try:
                  rows = positioning.fetch_rows(ticker, weeks=60)
                  snap = positioning.build_snapshot(ticker, rows)
              except Exception as exc:
                  print(f"  {ticker:<6} FETCH FAILED: {type(exc).__name__}: {exc}")
                  broken += 1
                  continue
              if snap is None:
                  print(f"  {ticker:<6} no usable rows ({len(rows)} returned)")
                  broken += 1
                  continue
              ok += 1
              print(f"  {ticker:<6} {snap.as_lines()[1]}  [{snap.weeks_of_history} weeks]")
          print(f"  -> {ok} ok, {broken} broken")
          # A mapped contract that says nothing is a failure, not a gap: the
          # cycle would show the model a stated blank for a source it was
          # promised. Red here, and the issue below, is how that gets heard.
          raise SystemExit(1 if broken else 0)
          EOF

      - name: Is every CFTC mapping still reporting
        # The check that would have caught TLT the day its contract went
        # quiet, instead of four and a half years later in a prompt. Prints
        # the newest report date per mapping, and flags any substring that
        # matches more than one market -- two contracts interleaved into one
        # series is a subtler wrong answer than no series.
        continue-on-error: true
        run: |
          set -o pipefail
          python backtest/probe_cftc_contracts.py | tee contracts.txt
          echo
          python backtest/probe_cftc_contracts.py --like "TREASURY" | tee -a contracts.txt
          echo
          # What each dataset actually contains this week. --like can only
          # find a contract whose new name kept the old keyword, and the
          # audit shows a batch of unrelated majors all stopping on
          # 2022-02-01 -- a rename, not a delisting. This is the only view
          # that can find the new name.
          python backtest/probe_cftc_contracts.py --live | tee -a contracts.txt

      - name: Fund block, as the model would read it
        # The numbers matter as much as the connection. A P/E of 0.06 is a
        # live wire, not a gap: it reads as usable and is not.
        run: |
          set -o pipefail
          python backtest/probe_fund_data.py ${{ inputs.tickers }} | tee funds.txt

      - name: The four keyed blocks, as the model would read them
        # The probe above proves the keys work. This proves the *blocks* do:
        # a key that answers and a section that renders correctly are two
        # different things, and the fund block taught us which one costs more
        # to get wrong.
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          USDA_NASS_KEY: ${{ secrets.USDA_NASS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -o pipefail
          python - <<'EOF' | tee keyed-blocks.txt
          from datetime import date

          from orchestrator import crops, earnings, energy, fred, sources

          print("configured:", sources.configured())
          print()

          print("=== MACRO releases (FRED) ===")
          releases = fred.build_releases(sources.fetch_fred_releases())
          for line in fred.as_lines(releases) or ["  (nothing returned)"]:
              print(f"  {line}")

          print()
          print("=== ENERGY INVENTORIES (EIA) ===")
          for ticker in sorted(energy.COVERAGE):
              snap = energy.build_snapshot(ticker, sources.fetch_energy_payloads(ticker))
              if snap is None:
                  print(f"  {ticker:<5} nothing returned")
                  continue
              print(f"  {ticker}:")
              for line in snap.as_lines()[:-1]:
                  print(f"    {line}")

          print()
          print("=== CROP CONDITION (USDA) ===")
          year = date.today().year
          for ticker in sorted(crops.COMMODITIES):
              snap = crops.build_snapshot(
                  ticker,
                  sources.fetch_crop_rows(ticker, year),
                  sources.fetch_crop_rows(ticker, year - 1),
                  year=year,
              )
              if snap is None:
                  print(f"  {ticker:<5} out of season or nothing returned")
                  continue
              print(f"  {ticker}:")
              for line in snap.as_lines()[:-1]:
                  print(f"    {line}")

          print()
          print("=== PRICE OUTLOOK (EIA STEO) ===")
          from orchestrator import outlook
          for ticker in sorted(outlook.COVERAGE):
              payloads = sources.fetch_outlook_payloads(ticker)
              snap = outlook.build_snapshot(ticker, payloads)
              if snap is None:
                  got = {k: len(outlook.by_month(v)) for k, v in payloads.items()}
                  print(f"  {ticker:<5} nothing usable returned (months per series: {got})")
                  continue
              print(f"  {ticker}:")
              for line in snap.as_lines()[1:-1]:
                  print(f"    {line}")

          print()
          print("=== RATE PATH (FRED) ===")
          path = fred.rate_path_line(releases.get("two_year"), releases.get("policy_rate"))
          print(f"  {path or 'nothing: two_year or policy_rate did not arrive'}")

          print()
          print("=== EARNINGS RECORD (Finnhub) ===")
          from config.instruments import SINGLE_NAMES
          missing = []
          for ticker in SINGLE_NAMES:
              snap = earnings.build_snapshot(ticker, sources.fetch_earnings_rows(ticker))
              if snap is None:
                  missing.append(ticker)
                  continue
              print(f"  {ticker:<6} {snap.as_lines()[0].split(': ', 1)[1]}")
          if missing:
              print(f"  -> no history for: {', '.join(missing)}")
          EOF

      - name: What holding a commodity fund costs
        # Key-free, and the one number that separates a fund holding bullion
        # in a vault from a fund rolling futures every month. USO once lost
        # most of its value over a stretch where crude ended flat.
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'EOF' | tee carry.txt
          import yfinance as yf

          from orchestrator import carry

          for ticker in sorted(carry.REFERENCES):
              symbol, name = carry.REFERENCES[ticker]
              try:
                  fund = yf.Ticker(ticker).history(period="2y", interval="1d")
                  commodity = yf.Ticker(symbol).history(period="2y", interval="1d")
              except Exception as exc:
                  print(f"  {ticker:<5} FAILED: {type(exc).__name__}: {exc}")
                  continue
              snap = carry.build_snapshot(ticker, fund, commodity)
              if snap is None:
                  fb = 0 if fund is None else len(fund)
                  cb = 0 if commodity is None else len(commodity)
                  print(f"  {ticker:<5} no block ({symbol}: {fb} fund bars, {cb} commodity bars)")
                  continue
              print(f"  {ticker:<5} {snap.as_lines()[0]}")
              print(f"        {snap.as_lines()[1]}")
          EOF

      - name: The macro backdrop
        # Six index symbols, and the one that matters is the curve: the slope
        # is a regime rather than a reading, and it is the only line here that
        # needs two symbols to have arrived to say anything at all.
        run: |
          set -o pipefail
          python - <<'EOF' | tee macro.txt
          import yfinance as yf
          from orchestrator import macro

          histories = {}
          for symbol in macro.SYMBOLS:
              try:
                  frame = yf.Ticker(symbol).history(period="1mo", interval="1d")
              except Exception as exc:
                  print(f"  {symbol:<12} FAILED: {type(exc).__name__}: {exc}")
                  continue
              if frame is None or frame.empty:
                  print(f"  {symbol:<12} no bars")
                  continue
              histories[symbol] = frame
          snapshot = macro.build_snapshot(histories)
          print()
          if snapshot is None:
              print("  no macro block at all")
          else:
              for line in snapshot.as_lines():
                  print(f"  {line}")
          EOF

      - name: Raw Yahoo payloads
        if: inputs.raw
        run: |
          set -o pipefail
          python backtest/probe_fund_data.py --raw ${{ inputs.tickers }} | tee funds-raw.txt

      # The output is the deliverable, so it goes somewhere readable on a
      # phone rather than only into the job log.
      - name: The whole prompt, for one ticker of each kind
        # Every step above proves one source. This proves the thing that
        # actually ships: `context.gather` end to end, exactly as a cycle
        # calls it, printed as the model would read it.
        #
        # It is the audit that would otherwise have to wait for a cycle to
        # run, and it answers the same question sooner: does every section
        # appear for the kind it belongs to, is any of them silently `n/a`
        # across the board, and how long does one ticker take now that a
        # sector fund looks up five holdings.
        #
        # No LLM is called and no order is placed -- `gather` only reads.
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          USDA_NASS_KEY: ${{ secrets.USDA_NASS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -o pipefail
          python - <<'EOF' | tee prompt.txt
          import time

          from orchestrator import context

          # One of each kind, plus the two with the most sources to gather.
          for ticker in ("MSFT", "XLE", "TLT", "GLD", "USO", "CORN"):
              started = time.monotonic()
              try:
                  ctx = context.gather(ticker, [], provider=context.get_provider())
                  prompt = ctx.as_prompt()
              except Exception as exc:
                  print(f"===== {ticker}: RAISED {type(exc).__name__}: {exc} =====")
                  continue
              took = time.monotonic() - started
              blanks = prompt.count("n/a")
              print(f"===== {ticker}  ({took:.1f}s, {len(prompt)} chars, {blanks} n/a) =====")
              print(prompt)
              if ctx.gaps:
                  print(f"  GAPS: {'; '.join(ctx.gaps)}")
              print()
          EOF

      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Keyed sources'
            echo
            echo '```'
            cat keys.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## CFTC positioning'
            echo
            echo '```'
            cat positioning.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## CFTC contract health'
            echo
            echo '```'
            cat contracts.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## Fund block'
            echo
            echo '```'
            cat funds.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## Keyed blocks'
            echo
            echo '```'
            cat keyed-blocks.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## Cost of holding'
            echo
            echo '```'
            cat carry.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## Whole prompt per kind'
            echo
            echo '```'
            cat prompt.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## Macro'
            echo
            echo '```'
            cat macro.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: data-sources
          path: |
            keys.txt
            keyed-blocks.txt
            carry.txt
            prompt.txt
            positioning.txt
            contracts.txt
            funds.txt
            funds-raw.txt
            macro.txt
          if-no-files-found: ignore

      - name: Push the dead source to the owner's phone
        # Same ntfy topic as the cycle's brief; a warning, not an alarm,
        # because the cycle still runs and shows the model a stated blank.
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "⚠️ A data source stopped answering",
                            "message": "The daily data-sources check failed. Until it is fixed the cycle shows the model a stated blank for that section.\n" + os.environ["RUN_URL"],
                            "priority": 4, "tags": ["warning"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Open the issue that says a source died
        # One open issue at a time, found by its label; a repeat failure adds
        # a comment to it rather than opening another. Assigned to the owner
        # so it is a participating notification, not a watch-list one.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create data-sources --force --color B60205 \
            --description "A source the prompt depends on stopped answering" > /dev/null
          {
            echo "The daily data-sources check failed on $(date -u +%Y-%m-%d). Read the run:"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "A source the prompt depends on is not answering, or a CFTC mapping has gone quiet."
            echo "Until it is fixed the cycle shows the model a stated blank for that section."
          } > "$RUNNER_TEMP/dead_source.md"
          open=$(gh issue list --label data-sources --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/dead_source.md" || true
          else
            gh issue create --title "A data source stopped answering" --label data-sources \
              --body-file "$RUNNER_TEMP/dead_source.md" --assignee "$OWNER" \
              || gh issue create --title "A data source stopped answering" --label data-sources \
                   --body-file "$RUNNER_TEMP/dead_source.md" \
              || echo "could not open the issue; the run is red regardless"
          fi
