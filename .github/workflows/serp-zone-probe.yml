name: serp zone probe

# Would a SERP API zone give the news fetch fewer empty answers than the
# Web Unlocker zone production uses? The first names of the watchlist,
# production's exact request through each zone, back to back; and zone B
# opened through the account API first when it does not exist (free to
# open, billed per request). The owner's decision of 16 Oct 2026. See
# replay/serp_zone_probe.py.
#
# It costs about forty news requests (a few cents). It never trades, asks
# no model, writes nothing and holds no broker key. Production's zone does
# not change here: that is the repository variable BRIGHTDATA_SERP_ZONE.
on:
  workflow_dispatch:
    inputs:
      zone_b:
        description: "The SERP API zone to compare with production's zone"
        default: "serp_news_probe"
      create:
        description: "Open zone B through the account API if it does not exist (yes/no)"
        default: "yes"
      count:
        description: "How many watchlist names to ask, from the front of the list"
        default: "20"
      country:
        description: "Also ask each zone from this exit country (blank: no such arm)"
        default: "us"
      delete_zone:
        description: "Remove this zone through the account API and do nothing else (blank: probe)"
        default: ""
  # workflow_dispatch does not exist until this file is on main, so -- like
  # unlocker-check.yml -- it also runs on its own pull request, and only when
  # it changes.
  pull_request:
    paths:
      - replay/serp_zone_probe.py
      - .github/workflows/serp-zone-probe.yml

permissions:
  contents: read

jobs:
  probe:
    # A pull request from a fork gets no secrets, so there is nothing to ask with.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Forty requests one after another, at 60 seconds each at the worst.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ask both zones
        # The Bright Data token and the zone variable the news fetch uses,
        # and nothing else. The inputs reach the script as variables, never
        # as shell text.
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_SERP_ZONE: ${{ vars.BRIGHTDATA_SERP_ZONE }}
          ZONE_B: ${{ inputs.zone_b }}
          CREATE: ${{ inputs.create }}
          COUNT: ${{ inputs.count }}
          COUNTRY: ${{ inputs.country }}
          DELETE_ZONE: ${{ inputs.delete_zone }}
        run: |
          if [ -n "$DELETE_ZONE" ]; then
            args=(--delete-zone "$DELETE_ZONE")
          else
            # On a pull request every input is blank: the zone and the
            # country below are the defaults the dispatch form shows.
            args=(--zone-b "${ZONE_B:-serp_news_probe}" --count "${COUNT:-20}" --country "${COUNTRY:-us}")
            [ "${CREATE:-yes}" = "yes" ] && args+=(--create)
          fi
          status=0
          python replay/serp_zone_probe.py "${args[@]}" > "$RUNNER_TEMP/probe.txt" || status=$?
          cat "$RUNNER_TEMP/probe.txt"
          {
            echo '## SERP zone probe'
            echo
            echo '```'
            cat "$RUNNER_TEMP/probe.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
