name: heartbeat

# One cycle per trading day, not one per hour. Fundamentals, analyst targets
# and insider filings change daily at most and technicals are on daily bars,
# so hourly runs were seven near-identical answers to the same question at
# seven times the cost. The holding horizon is days; one look after the open
# captures the day.
#
# 12:35 UTC is 08:35 New York in summer and 07:35 in winter -- before the
# 09:30 open in both. It starts early because the cycle asks both model stages
# through the Batch API at half price, and a batch answers when it answers:
# the hour before the session is where that waiting belongs. Gathering eighty
# contexts takes most of it, the batch is waited on for up to 35 minutes after
# that, and anything still outstanding is asked live, so the session is never
# what pays for the saving.
#
# The price of starting early is the cheap market-closed gate, which pre-market
# would refuse every run. A holiday therefore gathers context and pays for a
# batch that trades nothing -- the engine's own clock check still refuses the
# orders -- which is roughly ten cycles a year against a halved bill on the
# other 250.
#
# The second cron is a catch-up, and it exists because on 16 Sep the first one
# never fired. Not late, not failed -- GitHub created no run at all, and
# nothing noticed. The day was rescued only because an unrelated reminder
# happened to look. A schedule that can silently skip is not a schedule you
# can build a daily experiment on.
#
# 17:35 UTC is five hours after the first cron: long enough that even a cycle
# that waited out its whole batch deadline has finished (the concurrency group
# below would queue it anyway),
# and still comfortably before the 20:00 close, so a rescued day is a real
# trading day rather than a trade into the bell. It does nothing on the days
# the first cron works, which is almost all of them.
on:
  schedule:
    - cron: "35 12 * * 1-5"   # pre-market: gather, then wait on the batch
    - cron: "35 17 * * 1-5"   # catch-up; exits at once if 12:35 already ran
  workflow_dispatch:        # a manual run: a cycle, or just the protection pass
    inputs:
      mode:
        description: >-
          cycle = the full daily run (default). protect = place a stop on every
          open position that has none, and nothing else; works after the close,
          because the stops are good-till-cancelled and go live at the open.
        type: choice
        default: cycle
        options: [cycle, protect]

# Two runs writing the journal at once would race on the commit below.
concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions:
  contents: write           # only to push the journal back
  issues: write             # only to open the one issue that says the blend may leave shadow

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Was 90, sized for the live cycle: the 16 Sep run took 42m48s gathering
    # context for 80 names (roughly 32s/ticker, almost all waiting on other
    # people's servers) and finished with a 5% margin. That number is
    # unchanged by batching -- context is still gathered the same way -- but
    # it is no longer the whole job.
    #
    # The batched cycle adds up to two full BATCH_DEADLINE_SECONDS waits, one
    # after the other: the screen batch, then whatever it escalates. At 35
    # minutes each that is 70 minutes on top of the ~45 for context, before a
    # single order is dispatched -- 115 minutes in the worst case, which the
    # old 90-minute ceiling would have killed partway through the second wait.
    # A cycle killed there is the worst outcome available: both batches are
    # already paid for, position management already ran (moved early in
    # orchestrator/heartbeat.py for exactly this reason), but no answer this
    # run received ever reaches the engine or the journal.
    #
    # 180 gives that worst case a genuine margin rather than a tight fit, and
    # costs nothing to have: the runner is free on a public repository, and
    # the cost of not having the headroom is a cycle that traded nothing and
    # recorded nothing. Revisit this number if BATCH_DEADLINE_SECONDS changes
    # -- it is sized against it, not against the API's own 24-hour allowance.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Has today's cycle already run?
        # Every scheduled run asks, not only the catch-up. On 16 Sep the 15:05
        # cron was delivered hours late, after the 17:35 catch-up had already
        # run the cycle, and because only the catch-up asked, the day's cycle
        # ran twice. Which cron fired is not the question; whether the journal
        # already has today is. A manual dispatch is somebody deliberately
        # asking for a run and is never talked out of it.
        id: guard
        if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          ran=$(python analysis/cycle_day.py --journal logs/signal_journal.log)
          echo "ran=$ran" >> "$GITHUB_OUTPUT"
          if [ "$ran" = "yes" ]; then
            echo "A cycle is already journalled for today; this catch-up stops here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No cycle journalled for today. Running one now." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Protect every open position
        # The one thing worth doing after the close. Fails the run if any
        # position is still without a stop when it is done, because a green
        # tick on an unprotected book is the failure this exists to end.
        if: inputs.mode == 'protect'
        env:
          EXECUTION_MODE: direct
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m orchestrator.heartbeat --protect-only

      - name: Run one cycle
        # Skipped only when the guard above actually said yes. An unset output
        # -- which is what a skipped guard leaves -- must run the cycle, so the
        # test is on 'yes' and not on 'not no'. A protect-only dispatch never
        # runs a cycle: `inputs.mode` is empty on a scheduled run.
        if: steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        env:
          EXECUTION_MODE: direct          # no webhook: nothing to host here
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          # The four keyed sources (orchestrator/sources.py). Absent, each
          # section is a stated blank, which is exactly what the model saw
          # on 18 Sep: the keys were proven on the data-sources runner and
          # never passed here, so no live cycle had ever read the energy
          # inventories, the price outlook, the crop condition, the rate
          # path or the earnings record. tests/test_workflow_keys.py keeps
          # this list equal to the probe's.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          USDA_NASS_KEY: ${{ secrets.USDA_NASS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # No zone or watchlist variables: the watchlist lives in
          # config/watchlist.py and the Bright Data zone defaults to the one
          # `brightdata login` creates. Set BRIGHTDATA_SERP_ZONE as a
          # repository variable only if you have a real SERP API zone.
          BRIGHTDATA_SERP_ZONE: ${{ vars.BRIGHTDATA_SERP_ZONE }}
        # --premarket on the first cron only. Batched, the model stages are
        # asked offline at half price, and the waiting for them has to happen
        # somewhere: before the session, or during it. Starting at 12:35 UTC
        # puts it before, and gives up the cheap market-closed gate to do it,
        # which is why only the run that is meant to start early passes the
        # flag. The catch-up runs after the open and keeps the gate.
        run: |
          if [ "${{ github.event.schedule }}" = "35 12 * * 1-5" ]; then
            python -m orchestrator.heartbeat --once --premarket
          else
            python -m orchestrator.heartbeat --once
          fi

      - name: Render the cycle for a human
        # `always()` for the same reason the commit below is: a cycle that
        # failed some tickers still produced the lines worth reading, and a
        # report that only exists when everything worked is a report nobody
        # needs. Never fails the job -- it is a view of the journal, not a
        # second chance to break the cycle.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        run: |
          set -o pipefail
          # Rendered to a temp file first: `> logs/cycle_report.md` would
          # truncate the previous cycle's report before finding out this
          # cycle has nothing to render, replacing a good report with an
          # empty one.
          if python -m analysis.cycle_report > "$RUNNER_TEMP/cycle_report.md"; then
            mv "$RUNNER_TEMP/cycle_report.md" logs/cycle_report.md
            {
              echo '<!-- Rendered from logs/signal_journal.log by analysis/cycle_report.py -->'
              cat logs/cycle_report.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no journal lines to render; last report left in place"
          fi

      - name: Write the book snapshot
        # One JSON file the dashboard reads: positions against their stops,
        # the risk caps and how full they are, today's funnel and cost, and
        # the alarms. Derived from the journal and the audit log, never from
        # the broker; committed beside them so a page can read it with no
        # key. Never fails the job: a view of the record, not a second
        # chance to break the cycle.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        run: |
          if python -m analysis.book --json > "$RUNNER_TEMP/book.json"; then
            mv "$RUNNER_TEMP/book.json" logs/book.json
          else
            echo "book snapshot not written; previous one left in place"
          fi
          # The day in one notification, written here so the Routine that
          # pushes it to the owner's phone only has to fetch a text file:
          # a fresh Claude session may not run code it cloned, and must not
          # need to.
          if python -m analysis.brief > "$RUNNER_TEMP/brief.txt"; then
            mv "$RUNNER_TEMP/brief.txt" logs/brief.txt
          else
            echo "brief not written; previous one left in place"
          fi

      - name: Push the day to the owner's phone
        # The brief, sent the moment it is written, to an ntfy topic the
        # owner subscribes to on their phone: no Claude session, no account,
        # no login. A critical headline goes out as an urgent notification,
        # so the alarm arrives when the record says it, not an hour later.
        #
        # The topic name is the only secret and it never appears in a URL or
        # a log: the message is posted as JSON to ntfy's root, and the file
        # that carried it is removed. Unset, the step says so and sends
        # nothing; it never fails the job.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        id: phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DESK_URL: https://omrirulf.github.io/Algo-Trading-/
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os, pathlib
          text = pathlib.Path("logs/brief.txt").read_text(encoding="utf-8").strip()
          first, _, rest = text.partition("\n")
          priority = 5 if first.startswith("🔴") else 4 if first.startswith("⚠️") else 3
          tags = {5: ["rotating_light"], 4: ["warning"], 3: []}[priority]
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": first, "message": rest or first,
                            "priority": priority, "tags": tags, "click": os.environ["DESK_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Refit the blend weights
        # After the cycle, never before it: a cycle applies the weights the
        # previous run committed, and a signal whose horizon has not elapsed
        # is pending and left out of the fit, so nothing here learns from a
        # return that is not in yet. Never fails the job: a refit that cannot
        # fetch prices leaves the previous weights in place, which the next
        # cycle applies and flags stale after a fortnight.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        run: python learn/fit_weights.py || echo "refit skipped; previous weights left in place"

      - name: Score the journal
        # The report that decides when the blend may leave shadow, rendered
        # every day so nobody has to remember to run it. The scorer runs
        # twice, once for the text a person reads and once for the JSON the
        # next step reads; each fetches one price series per ticker. Never
        # fails the job: a scorer that cannot run leaves the previous report
        # in place and answers "not ready".
        #
        # Guarded like everything else after the catch-up check: on a day the
        # 15:05 cycle ran, this already ran with it, and doing it again would
        # re-fetch a price series per ticker to re-commit an identical report.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        id: score
        run: |
          set -o pipefail
          ready=false
          if python analysis/score_journal.py > "$RUNNER_TEMP/score_report.md" \
             && python analysis/score_journal.py --json > "$RUNNER_TEMP/score.json"; then
            mv "$RUNNER_TEMP/score_report.md" logs/score_report.md
            {
              echo '<!-- Rendered from logs/signal_journal.log by analysis/score_journal.py -->'
              echo '```text'
              cat logs/score_report.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if jq -e '.blend.promotion.ready == true' "$RUNNER_TEMP/score.json" > /dev/null; then
              ready=true
            fi
            jq -r '.blend.promotion.reason' "$RUNNER_TEMP/score.json" > "$RUNNER_TEMP/promotion_reason.txt"
          else
            echo "scorer could not run; last report left in place"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Open the issue that says the blend may leave shadow
        # Leaving shadow is a one-line code change a person reviews; this
        # step only makes sure the day it becomes justified is not missed.
        # One open issue at a time, found by its label, and nothing at all
        # once the mode is no longer shadow.
        #
        # Assigned to the repository owner on purpose. An unassigned issue only
        # notifies whoever is watching the repository, and "watching" email is
        # the first thing people turn off; an assignment is a participating
        # notification, which is emailed under the default settings and shows
        # up under the Assigned filter. The assignment is best-effort: an owner
        # GitHub will not accept as an assignee (an organisation, say) must not
        # cost the issue, and nothing here may fail a job that has already
        # placed trades.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect' && steps.score.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if ! grep -qE '^BLEND_MODE: Final\[str\] = "shadow"$' config/settings.py; then
            echo "BLEND_MODE is no longer shadow; nothing to announce"
            exit 0
          fi
          gh label create blend-ready --force --color 0E8A16 \
            --description "The scorer says the learned blend beats the model's conviction" > /dev/null
          if [ "$(gh issue list --label blend-ready --state open --json number --jq 'length')" != "0" ]; then
            echo "an open blend-ready issue already exists"
            exit 0
          fi
          {
            echo "The daily scorer says the learned blend has met the rule for leaving shadow:"
            echo
            echo "> $(cat "$RUNNER_TEMP/promotion_reason.txt")"
            echo
            echo "The full report for this run is \`logs/score_report.md\` at the commit this workflow pushed."
            echo
            echo "What happens next is a person's decision. The mode is the \`BLEND_MODE\` constant in"
            echo "\`config/settings.py\`, pinned to \`shadow\` by CI. Turning on \`gate\`, which can only remove"
            echo "trades, is a reviewed code change together with the wiring described as step 6b of the"
            echo "blend design. Nothing trades differently until that change is merged."
            echo
            echo "This issue is assigned to you because it needs a decision, not because anything"
            echo "is wrong. Closing it without acting is a valid answer: the blend keeps running in"
            echo "shadow, and this issue is opened again only if it is closed while the rule holds."
          } > "$RUNNER_TEMP/blend_ready.md"
          open_issue() {
            gh issue create --title "The learned blend is ready to leave shadow" \
              --label blend-ready --body-file "$RUNNER_TEMP/blend_ready.md" "$@"
          }
          open_issue --assignee "$OWNER" \
            || open_issue \
            || echo "could not open the issue; the report still says ready and tomorrow's run retries"

      - name: Commit the journal
        # `always()` because a cycle can fail *and* still have written lines:
        # a ticker that reached the model and was refused there is journalled
        # with its error, and those are the lines worth having when the run is
        # red. Skipping this step on failure would discard exactly the record
        # of the failure being investigated. A failed cycle still fails the
        # job -- always() changes what runs, not the verdict.
        if: always() && steps.guard.outputs.ran != 'yes'
        # The runner is discarded, so an uncommitted journal is a lost cycle --
        # and the journal is the only record of what the model saw. Committed
        # rather than uploaded as an artifact so the scorer can read the whole
        # history from a plain clone, and so it is readable on a phone.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f because logs/*.log is gitignored for local development, where
          # nobody wants their scratch runs committed. Here the journal is
          # the deliverable, so it is added explicitly by name.
          # fund_size.log is the one series nobody publishes: it exists only
          # because every cycle appends to it, so an uncommitted one is a lost
          # day of history that cannot be backfilled.
          git add -f logs/signal_journal.log logs/execution_audit.log logs/cycle_report.md logs/fund_size.log logs/blend_weights.json logs/score_report.md logs/book.json logs/brief.txt || true
          if git diff --cached --quiet; then
            echo "no journal changes"
            exit 0
          fi
          git commit -m "Journal: ${{ inputs.mode == 'protect' && 'protection pass' || 'cycle' }} at $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another run may have landed while this one ran. On 17 Sep one did:
          # a cancelled duplicate cycle pushed its journal in the two seconds
          # between this step's checkout and its push, the rebase conflicted
          # on the end of the audit log, and the eleven stop records this run
          # had written were lost from git. The logs merge as a union now
          # (.gitattributes), so the append-only files never conflict; the
          # rendered files are whole rewrites, and this run's is the newer.
          if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
            git checkout --theirs -- logs/cycle_report.md logs/score_report.md logs/blend_weights.json 2>/dev/null || true
            git add -f logs/cycle_report.md logs/score_report.md logs/blend_weights.json 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish the desk
        # The pages workflow cannot do this: a push made with the job's own
        # token starts no other workflow, by GitHub's rule, so after the
        # first real cycle the site still carried the previous day's built-in
        # copy. Same script the pages workflow runs, right after the journal
        # commit; never fails the job. The page reads the live snapshot
        # anyway, so this only refreshes the copy it opens on before the
        # first network read.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dashboard/publish.sh || echo "::warning::desk not published; the page still reads the live snapshot"

      - name: Sound the alarm on anything the record says went quietly wrong
        # The 17 Sep lesson: eleven positions spent a day with no stop, a
        # contract had been silent for years, and a cycle ran twice -- and
        # every one of those was in the record, where nothing read it. This
        # reads it. `analysis/health.py` turns the day's journal and audit
        # log into alarms; the step writes them to the summary, keeps exactly
        # one open issue assigned to the owner while anything is wrong (and
        # closes it the day the record is clean), and fails the run on a
        # critical alarm so the red mark is on the day it happened.
        #
        # After the commit on purpose: the record is safe in git before
        # anything here can go wrong. Never on a protect-only run, which
        # has its own exit code and writes no journal.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          python -m analysis.health --journal logs/signal_journal.log --audit logs/execution_audit.log > "$RUNNER_TEMP/health.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/health.md" >> "$GITHUB_STEP_SUMMARY"
          gh label create health-alarm --force --color B60205 \
            --description "The trading record says something went wrong today" > /dev/null
          open=$(gh issue list --label health-alarm --state open --json number --jq '.[0].number')
          if [ "$code" = "0" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Today's record is clean. Closing; this reopens on the next alarm." || true
            fi
            exit 0
          fi
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/health.md" || true
          else
            title="The trading record says something went wrong ($(date -u +%Y-%m-%d))"
            gh issue create --title "$title" --label health-alarm --body-file "$RUNNER_TEMP/health.md" --assignee "$OWNER" \
              || gh issue create --title "$title" --label health-alarm --body-file "$RUNNER_TEMP/health.md" \
              || echo "could not open the alarm issue; the summary above still carries it"
          fi
          if [ "$code" = "2" ]; then
            echo "::error::critical health alarm; see the job summary"
            exit 1
          fi

      - name: Push the failure to the owner's phone
        # A run that went red for any reason the brief did not already carry:
        # a crash before the record was written, a lost push, a dead
        # provider. When the health step is what failed, the brief above
        # already went out as the urgent alarm and this stays quiet.
        if: failure() && steps.guard.outputs.ran != 'yes' && steps.health.outcome != 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ inputs.mode || 'cycle' }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "🔴 The trading " + os.environ["MODE"] + " run failed",
                            "message": "Open the run to see which step went red:\n" + os.environ["RUN_URL"],
                            "priority": 5, "tags": ["rotating_light"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Push the archive to Supabase
        # Deliberately AFTER the commit above, and `always()` for the same
        # reason it is: the lines a failed cycle wrote belong in the archive
        # too. Note this is not a guard on the secrets -- see below.
        if: always() && steps.guard.outputs.ran != 'yes' && inputs.mode != 'protect'
        # Two more decisions, unchanged:
        #
        # After, because the journal must already be safe in git before this
        # touches the network. If this step fails the run goes red, but no line
        # is lost -- and the next cycle's push catches up on its own, since
        # rows are keyed on a content hash and conflicts are ignored on
        # arrival. That ordering is what lets this step be allowed to fail
        # loudly instead of being made advisory.
        #
        # No `if:` on the *credentials*, because the script already exits 0
        # saying "no remote configured" when the secrets are unset. Putting
        # that decision in tested Python rather than in a YAML expression means
        # it is covered by the test suite instead of only by a green run. The
        # same reasoning puts the cycle summary in Python: see
        # orchestrator/heartbeat.py:render_summary.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python store/push_remote.py
