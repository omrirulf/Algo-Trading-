name: heartbeat

# The Actions list shows this, so a cycle, a protection pass and a cycle the
# watchdog had to start are told apart without opening each run. A scheduled
# run has no inputs at all, so every `inputs.*` below is empty on one; the
# expressions are written so that empty means "a scheduled cycle".
#
# Since 26 Sep the title also names the starter that asked for the run
# ("heartbeat cycle (scheduler) via supabase-cron"), after the part the
# watchdog reads. That order matters: `source` is free text from whoever
# dispatched, and GitHub builds this title before any step can check it, so
# analysis/watchdog.py matches "heartbeat protect" and "heartbeat cycle
# (backup)" at the START of the title only -- a source that says "protect"
# cannot make a real cycle look like a protection pass to the guard.
run-name: ${{ inputs.mode == 'protect' && 'heartbeat protect' || format('heartbeat cycle ({0}) via {1}', github.event_name == 'schedule' && 'schedule' || inputs.started_by || 'manual', github.event_name == 'schedule' && 'github-schedule' || inputs.source || 'manual') }}

# One cycle per trading day, not one per hour. Fundamentals, analyst targets
# and insider filings change daily at most and technicals are on daily bars,
# so hourly runs were seven near-identical answers to the same question at
# seven times the cost. The holding horizon is days; one look after the open
# captures the day.
#
# 14:40 UTC is 10:40 New York in summer and 09:40 in winter: after the 09:30
# open in both seasons.
#
# Until 25 Sep the first cron was 12:35 UTC, before the open, and passed the
# pre-market flag. It was chosen for the Batch API: both model stages were
# asked offline at half price, a batch answers when it answers, and the hour
# before the session was where that waiting belonged. The flag gave up the
# cheap market-closed gate, which would otherwise have refused every early
# start.
#
# It stopped fitting on 23 Sep, when the full model moved to an endpoint with
# no batch and began to be asked live, with the screen off. A run started on
# time at 12:35 would have finished gathering context and asking the model by
# about 13:05-13:50 UTC and sent its orders then: mostly before the 13:30 UTC
# open in summer, and always before the 14:30 UTC open in winter. The engine
# refuses every order into a closed market ("market is closed") and the
# position manager skips the profit ladder, so an on-time day would have
# traded little or nothing. That never happened only because GitHub never delivered the
# cron on time: the 12:35 run arrived at 17:11-18:17 UTC on 21-24 Sep, 4.5 to
# 5.7 hours late every day, and every cycle since 21 Sep was really started by
# a Claude Routine at about 15:05. No cycle has ever run before the open.
#
# So the cycle now starts after the open, with plain --once, which keeps the
# market-closed gate. (The pre-market flag is still in
# orchestrator/heartbeat.py for a batched path that can use it; nothing here
# passes it, and tests/test_heartbeat_workflow.py keeps it that way.)
#
# The second cron is a catch-up, and it exists because on 16 Sep the first one
# never fired. Not late, not failed -- GitHub created no run at all, and
# nothing noticed. The day was rescued only because an unrelated reminder
# happened to look. A schedule that can silently skip is not a schedule you
# can build a daily experiment on.
#
# 17:35 UTC is almost three hours after the first cron: longer than any cycle
# has taken (26-74 minutes from first to last journal line on 21-24 Sep; the
# concurrency group below would queue it anyway), and before the latest safe
# start of 14:30 New York (18:30 UTC in summer, 19:30 in winter), so a day it
# rescues is still a real trading day. It does nothing on a day a cycle is
# already journalled. In practice GitHub has delivered it about three hours
# late too, after that latest start, where the guard below stops it.
#
# Because the cron cannot be trusted to be on time, it is not the main
# starter any more. Since 26 Sep (the owner's decision) the day's run is
# started from outside GitHub, and everything else is a backup. All of these
# can fire on the same day, and each names itself in the `source` input,
# which the run block carries into the journal:
#
#   1. The Supabase starter, the MAIN one: a pg_cron job in the Supabase
#      project "algo-trading-archive" that asks GitHub for a dispatch at
#      14:40 UTC, Monday to Friday (supabase/heartbeat_starter.sql;
#      started_by: scheduler, source: supabase-cron). A workflow_dispatch is
#      created when it is asked for; it is not held in GitHub's cron
#      backlog. The GitHub token it dispatches with lives only in Supabase
#      Vault ("github_heartbeat_dispatch"), never in this repository.
#   2. A temporary Claude Routine, the "bridge", at 14:42 UTC (source:
#      claude-bridge), kept until the Supabase starter has proved itself.
#   3. The two crons below (source: github-schedule).
#   4. Claude Routines in the owner's account: heartbeat at 15:05 and 15:45
#      UTC (source: claude-routine, or `manual` if a Routine does not say),
#      and heartbeat-watchdog.yml at 15:12.
#   5. heartbeat-watchdog.yml. From 15:10 UTC, 30 minutes after the start is
#      due, it checks whether a cycle is journalled or on its way. If not, it
#      starts this workflow itself (started_by: backup, source: watchdog)
#      and tells the owner's phone; if it is too late in the day, it only
#      tells the phone.
#
# The daily brief says which one started the day, and warns when it was not
# the Supabase starter.
#
# Every one of those is a request to run, never a cycle by itself. The
# guarantee: on one trading day only one run reaches "Run one cycle" after the
# open, and the only way a second one can is a person dispatching with
# `rerun`. (One that is over before the open found the market shut and placed
# nothing, so it neither counts nor stops the day's cycle.) It rests on
# three things. The guard step below, which every cycle run passes through:
# it stops when the journal on the branch's latest commit already has today,
# or when GitHub's own record shows that another run today (or an earlier
# attempt of this one) reached "Run one cycle" after the open, whatever its
# result. The concurrency group, which never lets two runs overlap, so no two
# guards decide at once. And the watchdog, which reads the same record and
# never starts a backup on a day the guard would stop it.
#
# GitHub's record is there for the one run the journal cannot show: a cycle
# that traded and whose commit never reached the branch. The broker refuses
# a second entry for the same ticker, side and UTC day, but not a second sale
# of a profit-ladder rung -- the ladder counts the rungs already sold from
# the audit log, which was lost with the journal. The guarantee needs GitHub
# to answer when the guard asks; when it does not, the guard decides from
# the journal alone and says so in the job summary.
on:
  schedule:
    - cron: "40 14 * * 1-5"   # the day's time, after the open in both seasons; a backup to the Supabase starter
    - cron: "35 17 * * 1-5"   # catch-up; stops at the guard if a cycle is journalled
  workflow_dispatch:        # the Supabase starter, a backup or a person: a cycle, or just the protection pass
    inputs:
      mode:
        description: >-
          cycle = the full daily run (default). protect = place a stop on every
          open position that has none, and nothing else; works after the close,
          because the stops are good-till-cancelled and go live at the open.
        type: choice
        default: cycle
        options: [cycle, protect]
      started_by:
        description: >-
          Who is starting this run. manual = any dispatch that does not say
          otherwise: a person, or a Claude Routine (the default). backup = the
          watchdog, when the day's run had not started. scheduler = an outside
          scheduler that is the day's main start (the Supabase starter); not a
          backup, so the watchdog does not count it against its own limit.
          Only a label: all are guarded the same way.
        type: choice
        default: manual
        options: [manual, backup, scheduler]
      source:
        description: >-
          Which starter asked for this run, for the journal and the daily
          brief: supabase-cron (the main starter), claude-bridge, claude-routine,
          watchdog or manual. Lower-case letters, digits and hyphens, at most 40;
          anything else is recorded as unknown. Only a label: it never changes
          what the guard decides.
        type: string
        default: manual
      rerun:
        description: >-
          Run a cycle even though the guard would stop it: one is already
          journalled today, another run today reached its trading step, or it
          is after the latest safe start -- only for a person re-running a day
          whose cycle failed, after checking the account. Pressing Re-run on
          such a run later does not trade again if its first attempt did.
        type: boolean
        default: false

# Two runs writing the journal at once would race on the commit below.
#
# It is also part of why a day cannot run twice: one run at a time, so what
# the guard reads -- the journal, and GitHub's record of the other runs --
# cannot be overtaken by another cycle while it reads. Note what
# GitHub does with a third arrival: a group holds one running and one
# pending run, and a newer run cancels the pending one rather than queueing
# behind it. That never lets a second cycle through (whichever run is left is
# still guarded), but it can cancel a pending protection pass, which then
# has to be dispatched again.
concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions:
  contents: write           # only to push the journal back
  issues: write             # only to open the one issue that says the blend may leave shadow
  actions: read             # only for the guard to read today's heartbeat runs and their steps

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Was 90, sized for the live cycle: the 16 Sep run took 42m48s gathering
    # context for 80 names (roughly 32s/ticker, almost all waiting on other
    # people's servers) and finished with a 5% margin. That number is
    # unchanged by batching -- context is still gathered the same way -- but
    # it is no longer the whole job.
    #
    # The batched cycle adds up to two full BATCH_DEADLINE_SECONDS waits, one
    # after the other: the screen batch, then whatever it escalates. At 35
    # minutes each that is 70 minutes on top of the ~45 for context, before a
    # single order is dispatched -- 115 minutes in the worst case, which the
    # old 90-minute ceiling would have killed partway through the second wait.
    # A cycle killed there is the worst outcome available: both batches are
    # already paid for, position management already ran (moved early in
    # orchestrator/heartbeat.py for exactly this reason), but no answer this
    # run received ever reaches the engine or the journal.
    #
    # 180 gives that worst case a genuine margin rather than a tight fit, and
    # costs nothing to have: the runner is free on a public repository, and
    # the cost of not having the headroom is a cycle that traded nothing and
    # recorded nothing. Revisit this number if BATCH_DEADLINE_SECONDS changes
    # -- it is sized against it, not against the API's own 24-hour allowance.
    #
    # Since 23 September the binding number is a different one. There is no
    # batch on an OpenAI-compatible endpoint, so the full-model stage is the
    # whole watchlist asked live: ceil(80 / FULL_MODEL_MAX_CONCURRENCY) = 20
    # rounds, each bounded by FULL_MODEL_TIMEOUT_SECONDS = 300s, so 100
    # minutes of worst case on top of the ~42 the cycle already spends
    # gathering context. That is 142 against this 180, which is why a
    # transport failure is NOT retried (orchestrator/llm.py): one more ask at
    # the same ceiling would double the term that does not fit.
    #
    # Measured, rather than worst case: 128s a call at high effort, four at a
    # time, is about 15 minutes for eighty names.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The branch as it is NOW, not as it was when this run was created.
        # Left to itself, checkout takes github.sha: the commit the branch
        # pointed at the moment the run was created. A run that then waited
        # in the concurrency group behind a running cycle was created before
        # that cycle committed its journal, so it would read a journal
        # without today in it, the guard below would say "no cycle yet", and
        # the day would run twice. Checking out the ref takes its latest
        # commit when the job starts, which is after the running cycle
        # pushed. Same pinned action, one input.
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: May this run start a cycle?
        # Every cycle run asks, whatever started it, not only the catch-up.
        #
        # On 16 Sep the 15:05 cron was delivered hours late, after the 17:35
        # catch-up had already run the cycle, and because only the catch-up
        # asked, the day's cycle ran twice. Which cron fired is not the
        # question; whether the journal already has today is. That became
        # "every scheduled run asks".
        #
        # Since 25 Sep a dispatch asks too. The watchdog's backup, the Claude
        # Routines and a late GitHub cron can all land on one day, and each
        # of them is only a request to run; this step decides which one
        # actually runs. A person who wants a second cycle anyway -- a day
        # whose cycle failed half-way, say -- dispatches with `rerun`, which
        # is the only way past this step. A protection pass is not a cycle
        # and never asks.
        #
        # Pressing "Re-run" on a run dispatched with `rerun` asks too. A
        # re-run replays the dispatch, inputs included, so without this the
        # second attempt of a rescue that traded and then lost its push
        # would trade the day again. `rerun` was given for the first
        # attempt, so on a later one this step asks only whether an earlier
        # attempt of this run reached "Run one cycle" (and stops if it
        # cannot tell: a person is at the page and can dispatch afresh).
        #
        # It reads the journal from the checkout above, which is the
        # branch's latest commit when this job started (see there for why
        # that matters), and the concurrency group means no other cycle can
        # be running while it reads.
        #
        # The journal cannot show the run that matters most: one that traded
        # and whose commit never reached the branch (a refused push, a lost
        # machine). The broker would refuse its entries a second time, but
        # the profit ladder counts the rungs already sold from the audit log
        # that was lost with it, so a second cycle would sell them again.
        # Until 25 Sep only the watchdog looked for that run, and the late
        # catch-up cron or a Routine passed this step on such a day. So the
        # step also asks GitHub for today's heartbeat runs (the New York
        # day, as the watchdog does) and, for each one, the steps it reached
        # in every attempt (`filter=all`: a run re-run from GitHub's page
        # still shows the attempt that traded). Whatever the run's status: a
        # run that traded and is re-run from its page waits as "pending"
        # again, and its jobs still hold the attempt that traded, while a run
        # that has never had a machine lists no jobs and counts as nothing.
        # If any other run today -- or an earlier attempt of this one --
        # reached "Run one cycle", whatever its result, the answer is
        # `already`. A protection pass never runs that step, so it never
        # stops a cycle, and nor does a "Run one cycle" that began and ended
        # before the 09:30 open: it found the market shut and placed nothing,
        # and counting it would let one early start close the whole day.
        # analysis/cycle_day.py decides, with the watchdog's own helpers, so
        # the two cannot read that record differently.
        #
        # GitHub failing to answer never fails this step and never costs the
        # day: the answer then rests on the journal alone, as it did before
        # 25 Sep, and the job summary says so. Only the script itself
        # breaking fails it. Each call is given 30 seconds (`timeout`): gh
        # has no time limit of its own, and a stalled answer would otherwise
        # hold this step, and with it the concurrency group, until the job's
        # 180 minutes ran out, with every other start waiting behind it. A
        # call that runs out of time is a call that failed, and is handled
        # like one.
        #
        # Two answers stop the run. `already`: a cycle is journalled for
        # today, or another run today reached its trading step. `too_late`:
        # neither, but it is past 14:30 New York (11:30 on a half day), the
        # latest start that still finishes before the close
        # (analysis/cycle_day.py:latest_start); a later start would send
        # orders into a closed market. The watchdog tells the owner's phone
        # about a lost day, and the step after this one does when it was the
        # watchdog's own backup that arrived too late.
        #
        # The output is `skip`, and every later step tests `skip != 'yes'`:
        # a guard that did not run (a protection pass, the first attempt of
        # a rerun) leaves it unset, and unset must mean "go on".
        id: guard
        if: inputs.mode != 'protect' && (inputs.rerun != true || github.run_attempt != '1')
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
          THIS_ATTEMPT: ${{ github.run_attempt }}
          RERUN: ${{ inputs.rerun }}
        run: |
          set -o pipefail
          record="$RUNNER_TEMP/guard"
          mkdir -p "$record/jobs"
          # `created` takes a date and reads it as UTC midnight. The New York
          # date is never later than the UTC one, so this covers every run of
          # today's New York day; the script drops the few from the evening
          # before.
          if timeout 30 gh api -X GET "repos/${{ github.repository }}/actions/workflows/heartbeat.yml/runs" \
               -f created=">=$(TZ=America/New_York date +%F)" -f per_page=100 > "$record/runs.json"; then
            for id in $(jq -r '.workflow_runs[]? | .id | numbers' "$record/runs.json" || true); do
              timeout 30 gh api "repos/${{ github.repository }}/actions/runs/$id/jobs?filter=all&per_page=100" > "$record/jobs/$id.json" \
                || { rm -f "$record/jobs/$id.json"; echo "::warning::could not read the steps of run $id; the guard decides without them"; }
            done
          else
            rm -f "$record/runs.json"
            echo "::warning::could not list today's heartbeat runs; the guard decides from the journal alone"
          fi
          # One word on stdout; the reason, written for the job summary, on
          # stderr.
          if ! decision=$(python analysis/cycle_day.py --journal logs/journal --decide \
                            --runs "$record/runs.json" --jobs "$record/jobs" \
                            --this-run "$THIS_RUN" --this-attempt "$THIS_ATTEMPT" --rerun "$RERUN" \
                            2> "$record/why.md"); then
            cat "$record/why.md"
            echo "::error::the guard's check could not run; see the log above"
            exit 1
          fi
          cat "$record/why.md"
          cat "$record/why.md" >> "$GITHUB_STEP_SUMMARY"
          case "$decision" in
            run)
              echo "skip=no" >> "$GITHUB_OUTPUT"
              ;;
            already)
              { echo "skip=yes"; echo "why=already"; } >> "$GITHUB_OUTPUT"
              ;;
            too_late)
              { echo "skip=yes"; echo "why=too_late"; } >> "$GITHUB_OUTPUT"
              echo "::warning::No cycle today: it is past the latest safe start (14:30 New York, 11:30 on a half day)"
              ;;
            *)
              echo "::error::the guard answered '$decision', which is none of run, already, too_late"
              exit 1
              ;;
          esac

      - name: Tell the owner's phone the backup started too late
        # The watchdog starts a backup only while there is still time
        # (analysis/watchdog.py stops 15 minutes before the latest safe
        # start), and its phone message says "the backup has started it, you
        # do not need to do anything". If GitHub then took longer than that
        # to bring this run to the guard -- a slow machine, a wait behind a
        # protection pass -- the guard said too_late and nothing traded, and
        # without this step the last word the owner had was the all-clear.
        #
        # Only for the backup: a late cron or a Routine that reaches the
        # guard too late promised nothing, and the watchdog's own next check
        # reports the lost day. Posted exactly like the other phone steps:
        # the topic goes in the JSON body, never a URL or a log, and the
        # file that carried it is removed; a phone error never fails the job.
        if: steps.guard.outputs.why == 'too_late' && inputs.started_by == 'backup'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          at = f"{now:%H:%M} UTC ({now.astimezone(ZoneInfo('Asia/Jerusalem')):%H:%M} Israel time)"
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"],
                            "title": "No trading run today: the backup started too late",
                            "message": ("The watchdog started today's run as the backup, but GitHub only brought it "
                                        f"to its start check at {at}, after the latest safe start, so it stopped "
                                        "without trading. Ignore the earlier message that said the backup had "
                                        "started it. Nothing is traded today."),
                            "priority": 5, "tags": ["rotating_light"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Protect every open position
        # The one thing worth doing after the close. Fails the run if any
        # position is still without a stop when it is done, because a green
        # tick on an unprotected book is the failure this exists to end.
        if: inputs.mode == 'protect'
        env:
          EXECUTION_MODE: direct
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m orchestrator.heartbeat --protect-only

      - name: Run one cycle
        # Skipped only when the guard above actually said skip. An unset
        # output -- which is what a skipped guard leaves -- must run the
        # cycle, so the test is on 'yes' and not on 'not no'. A protect-only
        # dispatch never runs a cycle: `inputs.mode` is empty on a scheduled
        # run.
        if: steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        env:
          EXECUTION_MODE: direct          # no webhook: nothing to host here
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          # The four keyed sources (orchestrator/sources.py). Absent, each
          # section is a stated blank, which is exactly what the model saw
          # on 18 Sep: the keys were proven on the data-sources runner and
          # never passed here, so no live cycle had ever read the energy
          # inventories, the price outlook, the crop condition, the rate
          # path or the earnings record. tests/test_workflow_keys.py keeps
          # this list equal to the probe's.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          USDA_NASS_KEY: ${{ secrets.USDA_NASS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # No zone or watchlist variables: the watchlist lives in
          # config/watchlist.py and the Bright Data zone defaults to the one
          # `brightdata login` creates. Set BRIGHTDATA_SERP_ZONE as a
          # repository variable only if you have a real SERP API zone.
          BRIGHTDATA_SERP_ZONE: ${{ vars.BRIGHTDATA_SERP_ZONE }}
          # The screening stage's optional endpoint -- the cheap first pass,
          # never the call that decides a trade. All three blank (the default)
          # and the screen stays on Claude Haiku, which is what
          # ANTHROPIC_API_KEY above already pays for. Named here because a
          # secret that is never passed to the step is a secret the cycle
          # cannot read: that is exactly how the four source keys went unused
          # until 18 Sep. The base URL and model are not secret, so they are
          # repository variables; only the key is a secret.
          SCREENING_BASE_URL: ${{ vars.SCREENING_BASE_URL }}
          SCREENING_MODEL: ${{ vars.SCREENING_MODEL }}
          # Blank asks the screen with reasoning off, as it always has. A
          # value here changes what decides which tickers reach the full
          # model, so it belongs to a compare_screening.py run at the same
          # effort, never to a guess.
          SCREENING_EFFORT: ${{ vars.SCREENING_EFFORT }}
          # Every plausible spelling collapses onto the one name the code
          # reads. The obvious thing to call a Gemini key is GEMINI_API_KEY,
          # and a key stored under a name nothing reads is silent: the screen
          # just stays on Haiku. A secret that does not exist is an empty
          # string here, which is falsy, so the chain picks the first one set.
          SCREENING_API_KEY: ${{ secrets.SCREENING_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GROQ_API_KEY }}
          # The bearer token for the endpoint that now answers the question
          # deciding what is traded. Which model and where are constants in
          # orchestrator/llm.py on purpose -- an environment variable must not
          # be able to change what gets traded without a diff -- so this key
          # is the only part of that choice living outside the repository.
          #
          # Same collapsing chain as the screen above, SCREENING_API_KEY
          # included. The token this model needs is stored under that name:
          # on 24 Sep 2026 the chain was tried without it, on the belief that
          # DEEPINFRA_API_KEY held the token, and every one of the 58 asked
          # names got HTTP 401 from the provider (the chain collapsed to a
          # different provider's key), so the day produced no signal. Until
          # the token is pasted in under FULL_MODEL_API_KEY or
          # DEEPINFRA_API_KEY, the screening name must stay in this chain,
          # and it must stay ahead of the names further right, which hold
          # other providers' keys. The name is confusing (it reads as "the
          # screening key" and is one, in the step above) but confusion is
          # cheaper than a silent day.
          FULL_MODEL_API_KEY: ${{ secrets.FULL_MODEL_API_KEY || secrets.DEEPINFRA_API_KEY || secrets.SCREENING_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GROQ_API_KEY }}
          # What started this run, for the run block below. Not secrets; an
          # input is empty on a scheduled run, which the script reads as
          # "the schedule" from the event name. RUN_SOURCE is free text from
          # the dispatcher: it reaches the shell only as this variable, never
          # pasted into the script, and the script keeps it only if it is a
          # short safe token (analysis/cycle_day.py:source_for).
          RUN_EVENT: ${{ github.event_name }}
          RUN_STARTED_BY: ${{ inputs.started_by }}
          RUN_SOURCE: ${{ inputs.source }}
          RUN_ID: ${{ github.run_id }}
        # Always plain --once, whatever started the run. The pre-market flag
        # gave up the market-closed gate so a 12:35 UTC start could wait on a
        # batch before the open; since the full model is asked live, starting
        # early only sends orders into a closed market (see the top of this
        # file). With the gate kept, a run that somehow starts before the open
        # stops at once and journals nothing, and it does not use up the day:
        # a "Run one cycle" that began and ended before 09:30 New York is not
        # counted by the guard or the watchdog, so the day's cycle still runs
        # after the open.
        #
        # HEARTBEAT_RUN is the run block every journal line of this cycle
        # carries: schedule, scheduler, backup or manual; the source (which
        # starter asked: supabase-cron, claude-bridge, watchdog,
        # github-schedule...); when the day's run was due (14:40 UTC) and
        # when this one started; how many minutes late; the run id. Built here, at the moment the cycle starts, so a rerun
        # (whose first attempt skips the guard) is described too, and
        # exported to this step's process only. A block that cannot be built
        # is left out -- never a reason not to trade.
        run: |
          HEARTBEAT_RUN=$(python analysis/cycle_day.py --run-block \
            --event "$RUN_EVENT" --started-by "$RUN_STARTED_BY" --source "$RUN_SOURCE" \
            --run-id "$RUN_ID") || HEARTBEAT_RUN=""
          export HEARTBEAT_RUN
          echo "run block: ${HEARTBEAT_RUN:-none}"
          python -m orchestrator.heartbeat --once

      - name: Record the paper account
        # The shadow funds run this repository's engine and position manager
        # against a simulated broker, and before any of them is worth reading
        # the simulation has to be shown to track the real account. That takes
        # the account's own numbers -- cash, equity at each day's close, what
        # filled and at what price, which stops are resting -- and the record
        # held none of them: the audit log says what was asked for, never
        # what the broker did.
        #
        # One JSON line per run, appended to logs/account.jsonl and committed
        # with the journal below. The recorder only reads: it places,
        # replaces and cancels nothing (tests/test_account_snapshot.py holds
        # it to that). It lives here because this is the one workflow that
        # already holds the Alpaca keys, so everything that measures the
        # funds reads the committed file and never needs a key of its own.
        #
        # Both modes, and after both of the steps that can change the book,
        # so the line is what they left behind -- a protection pass included,
        # since a stop placed after the close is exactly what it should show.
        # `always()` because a failed cycle may still have traded, and a red
        # run is the one whose real account most needs looking at. And
        # continue-on-error, with a short clock, because a recorder must never
        # be the reason a trading run fails: the script already exits 0 on
        # every error and writes the error as the line.
        if: always() && steps.guard.outputs.skip != 'yes'
        continue-on-error: true
        timeout-minutes: 3
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          MODE: ${{ inputs.mode || 'cycle' }}
        run: python -m app.account_snapshot --log logs/account.jsonl --mode "$MODE" >> logs/account.jsonl

      - name: Render the cycle for a human
        # `always()` for the same reason the commit below is: a cycle that
        # failed some tickers still produced the lines worth reading, and a
        # report that only exists when everything worked is a report nobody
        # needs. Never fails the job -- it is a view of the journal, not a
        # second chance to break the cycle.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        run: |
          set -o pipefail
          # Rendered to a temp file first: `> logs/cycle_report.md` would
          # truncate the previous cycle's report before finding out this
          # cycle has nothing to render, replacing a good report with an
          # empty one.
          if python -m analysis.cycle_report > "$RUNNER_TEMP/cycle_report.md"; then
            mv "$RUNNER_TEMP/cycle_report.md" logs/cycle_report.md
            {
              echo '<!-- Rendered from logs/journal/ by analysis/cycle_report.py -->'
              cat logs/cycle_report.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no journal lines to render; last report left in place"
          fi

      - name: Read the Supabase starter's log
        # Since 26 Sep the day's run is started by a pg_cron job in the
        # Supabase project (supabase/heartbeat_starter.sql), which writes one
        # row per request to public.starter_log; three minutes later a second
        # job copies GitHub's answer onto the row -- its status code and
        # nothing else. GitHub answers a dispatch it accepted with 204.
        #
        # This reads today's row, and only reads, so the brief can say what
        # the starter's own request got back: the one thing this run cannot
        # see for itself, since a run a backup started looks the same whether
        # the starter was refused (a 401 is an expired token), got no answer,
        # or never asked.
        #
        # Before the book snapshot, which reads the file, and committed with
        # the journal. Through store/starter_status.py, which reads the
        # Supabase key the one way it may be read (store/remote.py) and
        # prints only the status code and a short checked error: never a
        # header, never the key, and the log line below echoes only that.
        # Missing secrets, a paused project, a missing table or any other
        # failure write {"day", "status": "unknown", "why"}; nothing here can
        # fail the job (continue-on-error, a short clock, and a fallback line
        # if the script itself cannot run).
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if python store/starter_status.py > "$RUNNER_TEMP/starter_status.json"; then
            mv "$RUNNER_TEMP/starter_status.json" logs/starter_status.json
          else
            printf '{"day": "%s", "status": "unknown", "why": "the starter check could not run"}\n' \
              "$(date -u +%F)" > logs/starter_status.json
          fi
          echo "Supabase starter today: $(cat logs/starter_status.json)"

      - name: Write the book snapshot
        # One JSON file the dashboard reads: positions against their stops,
        # the risk caps and how full they are, today's funnel and cost, and
        # the alarms. Derived from the journal and the audit log, never from
        # the broker; committed beside them so a page can read it with no
        # key. Never fails the job: a view of the record, not a second
        # chance to break the cycle.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        run: |
          if python -m analysis.book --json > "$RUNNER_TEMP/book.json"; then
            mv "$RUNNER_TEMP/book.json" logs/book.json
          else
            echo "book snapshot not written; previous one left in place"
          fi
          # The day in one notification, written here so the Routine that
          # pushes it to the owner's phone only has to fetch a text file:
          # a fresh Claude session may not run code it cloned, and must not
          # need to.
          if python -m analysis.brief > "$RUNNER_TEMP/brief.txt"; then
            mv "$RUNNER_TEMP/brief.txt" logs/brief.txt
          else
            echo "brief not written; previous one left in place"
          fi

      - name: Push the day to the owner's phone
        # The brief, sent the moment it is written, to an ntfy topic the
        # owner subscribes to on their phone: no Claude session, no account,
        # no login. A critical headline goes out as an urgent notification,
        # so the alarm arrives when the record says it, not an hour later.
        #
        # The topic name is the only secret and it never appears in a URL or
        # a log: the message is posted as JSON to ntfy's root, and the file
        # that carried it is removed. Unset, the step says so and sends
        # nothing; it never fails the job.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        id: phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DESK_URL: https://omrirulf.github.io/Algo-Trading-/
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os, pathlib
          text = pathlib.Path("logs/brief.txt").read_text(encoding="utf-8").strip()
          first, _, rest = text.partition("\n")
          priority = 5 if first.startswith("🔴") else 4 if first.startswith("⚠️") else 3
          tags = {5: ["rotating_light"], 4: ["warning"], 3: []}[priority]
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": first, "message": rest or first,
                            "priority": priority, "tags": tags, "click": os.environ["DESK_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Refit the blend weights
        # After the cycle, never before it: a cycle applies the weights the
        # previous run committed, and a signal whose horizon has not elapsed
        # is pending and left out of the fit, so nothing here learns from a
        # return that is not in yet. Never fails the job: a refit that cannot
        # fetch prices leaves the previous weights in place, which the next
        # cycle applies and flags stale after a fortnight.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        run: python learn/fit_weights.py || echo "refit skipped; previous weights left in place"

      - name: Score the journal
        # The report that decides when the blend may leave shadow, rendered
        # every day so nobody has to remember to run it. The scorer runs
        # twice, once for the text a person reads and once for the JSON the
        # next step reads; each fetches one price series per ticker. Never
        # fails the job: a scorer that cannot run leaves the previous report
        # in place and answers "not ready".
        #
        # Guarded like everything else after the guard: on a day the cycle
        # already ran, this already ran with it, and doing it again would
        # re-fetch a price series per ticker to re-commit an identical report.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        id: score
        run: |
          set -o pipefail
          ready=false
          if python analysis/score_journal.py > "$RUNNER_TEMP/score_report.md" \
             && python analysis/score_journal.py --json > "$RUNNER_TEMP/score.json"; then
            mv "$RUNNER_TEMP/score_report.md" logs/score_report.md
            {
              echo '<!-- Rendered from logs/journal/ by analysis/score_journal.py -->'
              echo '```text'
              cat logs/score_report.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if jq -e '.blend.promotion.ready == true' "$RUNNER_TEMP/score.json" > /dev/null; then
              ready=true
            fi
            jq -r '.blend.promotion.reason' "$RUNNER_TEMP/score.json" > "$RUNNER_TEMP/promotion_reason.txt"
          else
            echo "scorer could not run; last report left in place"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Open the issue that says the blend may leave shadow
        # Leaving shadow is a one-line code change a person reviews; this
        # step only makes sure the day it becomes justified is not missed.
        # One open issue at a time, found by its label, and nothing at all
        # once the mode is no longer shadow.
        #
        # Assigned to the repository owner on purpose. An unassigned issue only
        # notifies whoever is watching the repository, and "watching" email is
        # the first thing people turn off; an assignment is a participating
        # notification, which is emailed under the default settings and shows
        # up under the Assigned filter. The assignment is best-effort: an owner
        # GitHub will not accept as an assignee (an organisation, say) must not
        # cost the issue, and nothing here may fail a job that has already
        # placed trades.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect' && steps.score.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if ! grep -qE '^BLEND_MODE: Final\[str\] = "shadow"$' config/settings.py; then
            echo "BLEND_MODE is no longer shadow; nothing to announce"
            exit 0
          fi
          gh label create blend-ready --force --color 0E8A16 \
            --description "The scorer says the learned blend beats the model's conviction" > /dev/null
          if [ "$(gh issue list --label blend-ready --state open --json number --jq 'length')" != "0" ]; then
            echo "an open blend-ready issue already exists"
            exit 0
          fi
          {
            echo "The daily scorer says the learned blend has met the rule for leaving shadow:"
            echo
            echo "> $(cat "$RUNNER_TEMP/promotion_reason.txt")"
            echo
            echo "The full report for this run is \`logs/score_report.md\` at the commit this workflow pushed."
            echo
            echo "What happens next is a person's decision. The mode is the \`BLEND_MODE\` constant in"
            echo "\`config/settings.py\`, pinned to \`shadow\` by CI. Turning on \`gate\`, which can only remove"
            echo "trades, is a reviewed code change together with the wiring described as step 6b of the"
            echo "blend design. Nothing trades differently until that change is merged."
            echo
            echo "This issue is assigned to you because it needs a decision, not because anything"
            echo "is wrong. Closing it without acting is a valid answer: the blend keeps running in"
            echo "shadow, and this issue is opened again only if it is closed while the rule holds."
          } > "$RUNNER_TEMP/blend_ready.md"
          open_issue() {
            gh issue create --title "The learned blend is ready to leave shadow" \
              --label blend-ready --body-file "$RUNNER_TEMP/blend_ready.md" "$@"
          }
          open_issue --assignee "$OWNER" \
            || open_issue \
            || echo "could not open the issue; the report still says ready and tomorrow's run retries"

      - name: Commit the journal
        # `always()` because a cycle can fail *and* still have written lines:
        # a ticker that reached the model and was refused there is journalled
        # with its error, and those are the lines worth having when the run is
        # red. Skipping this step on failure would discard exactly the record
        # of the failure being investigated. A failed cycle still fails the
        # job -- always() changes what runs, not the verdict.
        if: always() && steps.guard.outputs.skip != 'yes'
        # The runner is discarded, so an uncommitted journal is a lost cycle --
        # and the journal is the only record of what the model saw. Committed
        # rather than uploaded as an artifact so the scorer can read the whole
        # history from a plain clone, and so it is readable on a phone.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f because logs/*.log is gitignored for local development, where
          # nobody wants their scratch runs committed. Here the journal is
          # the deliverable, so it is added explicitly by name.
          # fund_size.log is the one series nobody publishes: it exists only
          # because every cycle appends to it, so an uncommitted one is a lost
          # day of history that cannot be backfilled.
          # account.jsonl is the same: the account as it stood at each run,
          # which nobody can read back later.
          git add -f logs/journal logs/execution_audit.log logs/cycle_report.md logs/fund_size.log logs/blend_weights.json logs/score_report.md logs/book.json logs/brief.txt logs/account.jsonl || true
          # starter_status.json is what the Supabase starter's own request
          # got back today, read just before the book (26 Sep). Added on its
          # own line, on purpose: `git add` with one path that does not exist
          # adds none of the others, and this file is not written on a
          # protection pass -- which would then commit no audit log at all.
          git add -f logs/starter_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no journal changes"
            exit 0
          fi
          git commit -m "Journal: ${{ inputs.mode == 'protect' && 'protection pass' || 'cycle' }} at $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another run may have landed while this one ran. On 17 Sep one did:
          # a cancelled duplicate cycle pushed its journal in the two seconds
          # between this step's checkout and its push, the rebase conflicted
          # on the end of the audit log, and the eleven stop records this run
          # had written were lost from git. The logs merge as a union now
          # (.gitattributes), so the append-only files never conflict; the
          # rendered files are whole rewrites, and this run's is the newer.
          sync_with_branch() {
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              git checkout --theirs -- logs/cycle_report.md logs/score_report.md logs/blend_weights.json logs/book.json logs/brief.txt logs/starter_status.json 2>/dev/null || true
              git add -f logs/cycle_report.md logs/score_report.md logs/blend_weights.json logs/book.json logs/brief.txt logs/starter_status.json 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue
            fi
          }
          # Three tries, five seconds apart, not one. A push that is refused
          # for good is the costliest failure this job has: the audit log
          # that counts the profit-ladder rungs sold today is lost with the
          # journal, and the guard then stops every other cycle today until
          # a person checks the account. Most refusals are not for good --
          # something else pushed to the branch between the pull and the
          # push, or the network dropped -- and a fresh pull and push a few
          # seconds later gets through. A try that fails half-way through its
          # rebase is undone before the next one starts. The last try is
          # outside the loop so that, if it fails too, the step fails as it
          # always has: the run goes red and the phone hears about it.
          for attempt in 1 2; do
            if sync_with_branch && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::the journal push did not go through (try $attempt of 3); trying again in 5 seconds"
            sleep 5
          done
          sync_with_branch
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish the desk
        # The pages workflow cannot do this: a push made with the job's own
        # token starts no other workflow, by GitHub's rule, so after the
        # first real cycle the site still carried the previous day's built-in
        # copy. Same script the pages workflow runs, right after the journal
        # commit; never fails the job. The page reads the live snapshot
        # anyway, so this only refreshes the copy it opens on before the
        # first network read.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dashboard/publish.sh || echo "::warning::desk not published; the page still reads the live snapshot"

      - name: Sound the alarm on anything the record says went quietly wrong
        # The 17 Sep lesson: eleven positions spent a day with no stop, a
        # contract had been silent for years, and a cycle ran twice -- and
        # every one of those was in the record, where nothing read it. This
        # reads it. `analysis/health.py` turns the day's journal and audit
        # log into alarms; the step writes them to the summary, keeps exactly
        # one open issue assigned to the owner while anything is wrong (and
        # closes it the day the record is clean), and fails the run on a
        # critical alarm so the red mark is on the day it happened.
        #
        # After the commit on purpose: the record is safe in git before
        # anything here can go wrong. Never on a protect-only run, which
        # has its own exit code and writes no journal.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          python -m analysis.health --journal logs/journal --audit logs/execution_audit.log > "$RUNNER_TEMP/health.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/health.md" >> "$GITHUB_STEP_SUMMARY"
          gh label create health-alarm --force --color B60205 \
            --description "The trading record says something went wrong today" > /dev/null
          open=$(gh issue list --label health-alarm --state open --json number --jq '.[0].number')
          if [ "$code" = "0" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Today's record is clean. Closing; this reopens on the next alarm." || true
            fi
            exit 0
          fi
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/health.md" || true
          else
            title="The trading record says something went wrong ($(date -u +%Y-%m-%d))"
            gh issue create --title "$title" --label health-alarm --body-file "$RUNNER_TEMP/health.md" --assignee "$OWNER" \
              || gh issue create --title "$title" --label health-alarm --body-file "$RUNNER_TEMP/health.md" \
              || echo "could not open the alarm issue; the summary above still carries it"
          fi
          if [ "$code" = "2" ]; then
            echo "::error::critical health alarm; see the job summary"
            exit 1
          fi

      - name: Push the failure to the owner's phone
        # A run that went red for any reason the brief did not already carry:
        # a crash before the record was written, a lost push, a dead
        # provider. When the health step is what failed, the brief above
        # already went out as the urgent alarm and this stays quiet.
        if: failure() && steps.guard.outputs.skip != 'yes' && steps.health.outcome != 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ inputs.mode || 'cycle' }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "🔴 The trading " + os.environ["MODE"] + " run failed",
                            "message": "Open the run to see which step went red:\n" + os.environ["RUN_URL"],
                            "priority": 5, "tags": ["rotating_light"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Push the archive to Supabase
        # Deliberately AFTER the commit above, and `always()` for the same
        # reason it is: the lines a failed cycle wrote belong in the archive
        # too. Note this is not a guard on the secrets -- see below.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        id: archive
        # Two more decisions, unchanged:
        #
        # After, because the journal must already be safe in git before this
        # touches the network. If this step fails the run goes red, but no line
        # is lost -- and the next cycle's push catches up on its own, since
        # rows are keyed on a content hash and conflicts are ignored on
        # arrival. That ordering is what lets this step be allowed to fail
        # loudly instead of being made advisory.
        #
        # No `if:` on the *credentials*, because the script already exits 0
        # saying "no remote configured" when the secrets are unset. Putting
        # that decision in tested Python rather than in a YAML expression means
        # it is covered by the test suite instead of only by a green run. The
        # same reasoning puts the cycle summary in Python: see
        # orchestrator/heartbeat.py:render_summary.
        #
        # Since 26 Sep it also writes down how it went (--status): when it
        # was tried, when a push last worked, and why not in a few fixed
        # words ("not configured", "project paused or unreachable", "HTTP
        # <code>"). The Supabase project was paused once already because
        # every push had quietly printed "No remote archive configured" --
        # the two secrets were never set -- and a free project nothing writes
        # to is paused after about a week. The two steps below commit that
        # record and tell the phone the same day a push fails; the brief
        # warns every day it is not configured. The step itself still fails
        # loudly on a failed push, as before.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python store/push_remote.py --status logs/archive_status.json

      - name: Tell the owner's phone the archive push failed
        # The same day, not in tomorrow's brief. `always()` because the push
        # step above fails the run when it fails, and that is exactly when
        # this must run; the failure push further up has already had its
        # turn by then. Only for a push that was tried and failed: "not
        # configured" is a daily warning in the brief instead, not a page.
        #
        # Reads the record the push just wrote, and only its fixed words --
        # never the remote's own text. A record not written by this run (the
        # push crashed before it could write one) still pages, if the step
        # failed. Posted exactly like the other phone steps: the topic goes
        # in the JSON body, never a URL or a log, the file that carried it is
        # removed, and a phone error never fails the job.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSH_OUTCOME: ${{ steps.archive.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os, pathlib, re
          from datetime import datetime, timedelta, timezone
          try:
              status = json.loads(pathlib.Path("logs/archive_status.json").read_text(encoding="utf-8"))
          except (OSError, ValueError):
              status = {}
          status = status if isinstance(status, dict) else {}
          try:
              tried = datetime.fromisoformat(str(status.get("last_attempt")))
          except ValueError:
              tried = None
          if tried is not None and tried.tzinfo is None:
              tried = tried.replace(tzinfo=timezone.utc)
          # Written by this run: the job's own ceiling is 180 minutes.
          fresh = tried is not None and tried > datetime.now(timezone.utc) - timedelta(hours=4)
          error = str(status.get("error") or "")
          if not re.fullmatch(r"not configured|project paused or unreachable|HTTP [0-9]{3}|push crashed \([A-Za-z]+\)", error):
              error = "an unrecognised error"
          if fresh and status.get("ok") is False and error != "not configured":
              reason = error
          elif os.environ.get("PUSH_OUTCOME") == "failure" and not fresh:
              reason = "the push step failed before it could say why"
          else:
              raise SystemExit(0)
          advice = {
              "project paused or unreachable": "The Supabase project may be paused; restore it "
                                               "(Supabase dashboard, project algo-trading-archive, Restore). "
                                               "The Supabase starter lives there too.",
              "HTTP 401": "Supabase refused the key: check the SUPABASE_SERVICE_KEY secret.",
          }.get(reason, "Open the run to see the push step's log.")
          last = status.get("last_success")
          since = (f"The last push that worked was on {last[:10]}." if isinstance(last, str) and last
                   else "No push has worked yet.")
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"],
                            "title": "⚠️ Archive push to Supabase failed",
                            "message": (f"Today's push of the journal to the Supabase archive failed: {reason}. "
                                        f"{advice} No line is lost: the journal is in git, and the next push "
                                        f"that works sends what is missing. {since}"),
                            "priority": 4, "tags": ["warning"], "click": os.environ["RUN_URL"]}))
          EOF
          if [ ! -s "$RUNNER_TEMP/phone.json" ]; then
            rm -f "$RUNNER_TEMP/phone.json"
            echo "the archive push did not fail today (or is only not configured); nothing sent"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Commit the archive push record
        # logs/archive_status.json is written by the push, which runs after
        # the journal's commit, so it gets a small commit of its own: the
        # brief and the health check read it on the next run, and the date
        # of the last push that worked must survive the runner. Same pull
        # --rebase and three tries as "Commit the journal", but it never
        # fails the job: a record about the archive is not worth a red run,
        # and the phone step above has already said what matters. The file
        # is a whole rewrite, so on a conflict this run's is kept, the newer.
        if: always() && steps.guard.outputs.skip != 'yes' && inputs.mode != 'protect'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logs/archive_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no archive record changes"
            exit 0
          fi
          git commit -m "Archive push record at $(date -u +'%Y-%m-%dT%H:%MZ')"
          sync_with_branch() {
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              git checkout --theirs -- logs/archive_status.json 2>/dev/null || true
              git add -f logs/archive_status.json 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue
            fi
          }
          for attempt in 1 2 3; do
            if sync_with_branch && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::the archive record push did not go through (try $attempt of 3)"
            sleep 5
          done
          echo "::warning::the archive push record was not committed; the next run writes a new one"
          exit 0
