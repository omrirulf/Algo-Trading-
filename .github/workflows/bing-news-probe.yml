name: bing news probe

# Would Bing News answer where Google refuses (the owner's question of 4 Nov
# 2026)? replay/bing_news_probe.py asks production's Google request and
# Bing's RSS feed for the same names, prints what each answered, and changes
# nothing. Read-only beyond the Bright Data asks it pays for (two a name).
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many watchlist names to ask, from the front of the list"
        default: "20"
      no_bright_data:
        description: "Ask only Bing directly: no token used, nothing billed (yes/no)"
        default: "no"
      titles:
        description: "Print each arm's first N headlines under its line (0 prints none)"
        default: "0"
  pull_request:
    paths:
      - replay/bing_news_probe.py
      - .github/workflows/bing-news-probe.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ask Google and Bing for the same names
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_SERP_ZONE: ${{ vars.BRIGHTDATA_SERP_ZONE }}
          COUNT: ${{ inputs.count }}
          NO_BRIGHT_DATA: ${{ inputs.no_bright_data }}
          TITLES: ${{ inputs.titles }}
        run: |
          # On a pull request every input is blank: a few names, Bing only, nothing billed.
          args=(--count "${COUNT:-5}" --titles "${TITLES:-0}")
          if [ "${NO_BRIGHT_DATA:-yes}" = "yes" ]; then args+=(--no-bright-data); fi
          status=0
          python replay/bing_news_probe.py "${args[@]}" > "$RUNNER_TEMP/probe.txt" || status=$?
          cat "$RUNNER_TEMP/probe.txt"
          {
            echo '## Bing news probe'
            echo
            echo '```'
            cat "$RUNNER_TEMP/probe.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
