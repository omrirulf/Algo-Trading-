name: market checks

# Answers the open question behind the two-sleeve watchlist: do index funds
# and single names actually behave differently under the risk engine, and is
# the ETF position cap sized right?
#
# It lives here rather than being run locally because it needs two years of
# real OHLC from Yahoo, and a runner has the open internet access for that.
# Nothing here needs a credential: yfinance is unauthenticated, no LLM is
# called, and no order is ever placed.
on:
  workflow_dispatch:
    inputs:
      period:
        description: "History to replay (yfinance period, e.g. 2y, 5y)"
        default: "2y"
      every:
        description: "Open a trade every N bars"
        default: "5"
      side:
        description: "Direction to test"
        default: "buy"
        type: choice
        options: [buy, sell]

permissions:
  contents: read            # reads bars, writes nothing back

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify every ticker resolves
        # The watchlist was written without market access, and ETNs get called
        # while small funds delist. A symbol that stopped resolving would fail
        # its ticker every cycle as a silent "no bars" gap.
        #
        # `set -o pipefail` is load-bearing: without it `python ... | tee`
        # reports tee's exit status, so a script that exited 1 on 36 broken
        # tickers still shows a green step. That is exactly what happened on
        # the first run of this workflow.
        #
        # No continue-on-error either. This check exists to fail loudly; making
        # it advisory turned a total outage into a green tick.
        run: |
          set -o pipefail
          python backtest/verify_tickers.py | tee tickers.txt

      - name: The two fund sources answer for real
        # Neither can be reached from a development container, and both are
        # new dependencies of the daily cycle, so this is where they are
        # proved. Advisory on purpose: a CFTC outage must not fail the
        # workflow that also verifies every ticker still trades.
        continue-on-error: true
        run: |
          python - <<'EOF'
          from config.instruments import FOCUSED_FUNDS, BROAD_FUNDS, COMMODITY_FUNDS
          from orchestrator import funds, positioning

          print("=== CFTC positioning ===")
          ok = broken = 0
          for ticker in ("GLD", "USO", "CORN", "TLT", "UUP", "RSP"):
              try:
                  rows = positioning.fetch_rows(ticker, weeks=60)
                  snap = positioning.build_snapshot(ticker, rows)
              except Exception as exc:
                  print(f"  {ticker:<6} FETCH FAILED: {type(exc).__name__}: {exc}")
                  broken += 1
                  continue
              if snap is None:
                  print(f"  {ticker:<6} no usable rows ({len(rows)} returned)")
                  broken += 1
                  continue
              ok += 1
              print(f"  {ticker:<6} {snap.as_lines()[1]}  [{snap.weeks_of_history} weeks]")
          print(f"  -> {ok} ok, {broken} broken")

          print()
          print("=== yfinance fund data ===")
          import yfinance as yf
          for ticker in ("XLE", "SMH", "TLT", "HYG", "EWZ"):
              try:
                  data = yf.Ticker(ticker).funds_data
                  snap = funds.build_snapshot(
                      ticker,
                      equity_holdings=getattr(data, "equity_holdings", None),
                      bond_holdings=getattr(data, "bond_holdings", None),
                      fund_operations=getattr(data, "fund_operations", None),
                      fund_overview=getattr(data, "fund_overview", None),
                      top_holdings=getattr(data, "top_holdings", None),
                      sector_weightings=getattr(data, "sector_weightings", None),
                  )
              except Exception as exc:
                  print(f"  {ticker:<6} FAILED: {type(exc).__name__}: {exc}")
                  continue
              print(f"  {ticker:<6} {' | '.join(snap.as_lines()[1:3])}")
          EOF

      - name: Compare the sleeves
        id: compare
        run: |
          set -o pipefail
          python backtest/compare_sleeves.py \
            --period "${{ inputs.period }}" \
            --every "${{ inputs.every }}" \
            --side "${{ inputs.side }}" \
            | tee comparison.txt

      - name: Machine-readable copy
        run: |
          python backtest/compare_sleeves.py \
            --period "${{ inputs.period }}" \
            --every "${{ inputs.every }}" \
            --side "${{ inputs.side }}" \
            --json > comparison.json

      # The report is the deliverable, so it goes somewhere readable on a
      # phone rather than only into the job log.
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Ticker verification'
            echo
            echo '```'
            cat tickers.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo '## Sleeve comparison'
            echo
            echo '```'
            cat comparison.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-checks
          path: |
            tickers.txt
            comparison.txt
            comparison.json
