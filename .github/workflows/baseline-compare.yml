name: baseline compare

# Did the model's trades beat doing nothing clever?
#
# score_journal.py reports a hit rate that is close-to-close and blind to the
# stop: a "hit" there means the market moved the right way at all over the
# horizon, not that the trade made money. This re-simulates the same
# acted-on signals through the risk engine's real stop, gap and sizing
# arithmetic, and sets them beside buy-and-hold of the same names, the whole
# watchlist, and SPY.
#
# It runs here for the same boring reason correlations.yml does: yfinance
# needs the open internet and a runner has it. NO credential of any kind is
# used -- yfinance is unauthenticated, the journal is already in the repo,
# and no broker or model key is passed -- so this job cannot trade, cannot
# call a model, and costs nothing to run. CI separately enforces that
# analysis/ can neither write a file nor reach an order path.
#
# Nothing downstream consumes the output. It is read by a person.
on:
  workflow_dispatch:
    inputs:
      horizon:
        description: "Trading sessions held after entry"
        default: "3"
      floor:
        description: "Conviction floor: only signals at or above this were acted on (blank: the engine's)"
        default: ""
      equity:
        description: "Account size the position sizing is computed against"
        default: "100000"
  # Also on a pull request that changes the measurement itself, for the same
  # reason correlations.yml does it: workflow_dispatch does not exist until
  # the file reaches the default branch, so without this the first run could
  # only happen after merge -- the wrong order for something whose entire
  # purpose is to inform a decision about whether to keep the thing it
  # measures.
  pull_request:
    paths:
      - "analysis/baseline_compare.py"
      - "analysis/metrics.py"
      - "analysis/returns.py"
      - "backtest/simulate.py"
      - ".github/workflows/baseline-compare.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    # One yfinance fetch per traded ticker, plus one per watchlist name for
    # the buy-and-hold row. Eighty sequential fetches is minutes, not
    # seconds, and a rate-limited fetch retries -- but nothing here is
    # per-call model latency, so this is nowhere near the hours the model
    # comparison workflows need.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Did the trades beat buy-and-hold
        env:
          # Defaulted here rather than in the `run` line so the pull_request
          # trigger, which supplies no inputs at all, still runs at the
          # horizon the scorer itself defaults to.
          HORIZON: ${{ inputs.horizon || '3' }}
          FLOOR: ${{ inputs.floor }}
          EQUITY: ${{ inputs.equity || '100000' }}
        run: |
          set -o pipefail
          ARGS="--horizon $HORIZON --equity $EQUITY"
          # Blank means "whatever the engine's MIN_CONVICTION is today",
          # which is what a run with no override should measure.
          if [ -n "$FLOOR" ]; then
            ARGS="$ARGS --floor $FLOOR"
          fi
          python analysis/baseline_compare.py $ARGS | tee baseline.txt

      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Model trades vs. buy-and-hold'
            echo
            echo '```'
            cat baseline.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: baseline-compare
          path: baseline.txt
