name: scoring-prices

# Copy the nightly scoring prices into the Supabase archive.
#
# The horse race (horse-race.yml) and the shadow funds (funds.yml) score
# every night against daily prices fetched from yfinance, and those prices
# are not the record's to keep: a vendor revises a bar or drops a row, and a
# result that cannot be re-scored on the prices it was scored on cannot be
# checked. Both runs now hand over the exact table they used, as the
# artifact "scoring-prices" (analysis/price_tape.py), and the funds run
# commits its SHA-256 (prices_sha256) in logs/funds.json and
# logs/race_gate.json. This workflow is the other half: it downloads the
# table from the run that just finished and pushes it
# (store/push_remote.py --only prices, store/scoring_prices.py), which
# refuses a table that does not hash to its own prices_sha256.
#
# Why a separate workflow: the race and the funds hold no secret at all
# (a CI guardrail checks that for both), so neither can reach the archive.
# This one holds the archive's key and nothing else, and it trusts nothing
# the table says beyond its shape and its hash.
#
# Only for runs of those two workflows on this repository's main branch
# that were started by their schedule or by hand -- never for a pull
# request's run, whose artifact anyone opening a pull request could shape.
# Nothing in the race, the funds or the pre-registration reads the archive;
# the git record stays the official one.
on:
  workflow_run:
    workflows: ["horse race", "shadow funds"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "A horse race or shadow funds run whose scoring-prices artifact to push (90 days)"
        required: true

concurrency:
  group: scoring-prices
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # only to download the finished run's artifact

jobs:
  push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download the run's price tables
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scoring-prices
          path: ${{ runner.temp }}/scoring-prices
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Push them to Supabase
        id: push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          case "$SOURCE_RUN" in (*[!0-9]*|'') echo "run id must be a number"; exit 2;; esac
          set -- $(find "$RUNNER_TEMP/scoring-prices" -maxdepth 1 -name '*.json' | sort)
          if [ "$#" = "0" ]; then
            echo "no price table in the artifact; nothing to push"
            exit 0
          fi
          ARGS=""
          for table in "$@"; do ARGS="$ARGS --prices $table"; done
          python store/push_remote.py --only prices --run-id "$SOURCE_RUN" $ARGS

      - name: Tell the owner's phone the price copy failed
        # The same day, like the archive push's own alert: fixed words and
        # the run's link, never the remote's text. The topic goes in the
        # JSON body, never a URL or a log.
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"],
                            "title": "⚠️ Scoring prices not archived",
                            "message": ("Tonight's scoring prices could not be copied to the Supabase archive. "
                                        "Nothing is lost: the table is the run's artifact for 90 days, and its "
                                        "hash is in git. Run scoring-prices.yml with that run's id to retry."),
                            "priority": 3, "tags": ["warning"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Tell the owner's phone the shekel rates failed
        # Pre-registration section 11.9 (the owner, 3 Oct 2026). The funds run
        # fetches the Bank of Israel's rates every night, and it holds no
        # secret (a CI guardrail), so its alert is sent from here. Only for a
        # shadow funds run, whose artifact holds funds.json: no rate table
        # (fx-rates.json missing or unreadable), or a table in which none of
        # the last three days came from the Bank of Israel, is a failed night. Fixed words; the
        # night's counts are public in logs/after_tax.md.
        # Not on a by-hand retry of an old night's archive push: that night's
        # alert was sent then.
        if: always() && github.event_name == 'workflow_run' && steps.download.outcome == 'success'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          verdict=$(python - "$RUNNER_TEMP/scoring-prices" <<'EOF'
          import json, pathlib, sys
          folder = pathlib.Path(sys.argv[1])
          if not (folder / "funds.json").is_file():
              print("not-funds")
              raise SystemExit
          try:
              rows = sorted(json.loads((folder / "fx-rates.json").read_text(encoding="utf-8"))["rows"],
                            key=lambda row: row["date"])
              latest = [row.get("ticker") == "USDILS" for row in rows[-3:]]
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              print("missing")
              raise SystemExit
          # None of the last three days from the Bank of Israel: its feed has
          # stopped, or answers without new days (one Israeli holiday, or two
          # together, never makes three).
          print("ok" if any(latest) else "no-boi")
          EOF
          )
          echo "shekel rates tonight: $verdict"
          case "$verdict" in
            ok|not-funds) exit 0;;
          esac
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          VERDICT="$verdict" python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          if os.environ["VERDICT"] == "missing":
              title = "⚠️ No shekel rate table tonight"
              message = ("The Bank of Israel rate table could not be made tonight, so there is no after-tax or "
                         "shekel view tonight. Nothing is traded and no rate is guessed. The next night tries "
                         "again.")
          else:
              title = "⚠️ Bank of Israel not reached tonight"
              message = ("None of the last three days in tonight's shekel rate table came from the Bank of "
                         "Israel: they came from another source, counted in logs/after_tax.md. Nothing is "
                         "traded.")
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": title, "message": message,
                            "priority": 3, "tags": ["warning"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

      - name: Tell the owner's phone the fund test's bar differs from the plan
        # The owner's Addition 1 to the checkpoint verdict (6 Oct 2026; section
        # 11.7): when the bar used at a fund-test look differs from the planned
        # bar, the owner logs it in the Amendments table the day it is used.
        # The funds run holds no secret, so the alert is sent from here, after a
        # green shadow funds run on main. It reads the funds record that run
        # committed: main is fetched fresh here (this job's own checkout may be
        # older than the funds commit), and nothing is taken from the artifact,
        # whose every *.json is pushed as prices. Once: only for a look record
        # made by this funds run (its made_at is the document's generated_at,
        # the full stamp, so a second run the same day sends nothing), read,
        # with bar_differs true. Only the look's number and its two bars are
        # sent, both public. The race's bars are fixed (3.47, 2.45, 2.00), so
        # the race has no such alert. Not on a by-hand retry of an old night's
        # push, nor on a re-run of this job ("Re-run jobs" keeps the
        # workflow_run event): that night's alert was sent, or tried, then.
        if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.name == 'shadow funds' && github.run_attempt == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          record="$RUNNER_TEMP/funds-record.json"
          rm -f "$record"
          if git fetch --no-tags --depth=1 origin main; then
            git show FETCH_HEAD:logs/funds.json > "$record" 2>/dev/null || rm -f "$record"
          else
            echo "::warning::main could not be fetched; the fund test's bar was not checked tonight"
          fi
          message=$(python - "$record" <<'EOF'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  document = json.load(handle)
              tonight = document["generated_at"]
              looks = document["fund_test"]["looks"]
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              raise SystemExit   # no record, or one from before the checkpoint verdict: nothing to say
          def number(value):
              return isinstance(value, (int, float)) and not isinstance(value, bool)
          lines = []
          for look in looks if isinstance(looks, list) else []:
              if not isinstance(look, dict) or look.get("look") not in (1, 2, 3):
                  continue
              if not isinstance(tonight, str) or look.get("made_at") != tonight or look.get("status") != "read":
                  continue
              if look.get("bar_differs") is not True or not (number(look.get("bar")) and number(look.get("planned_bar"))):
                  continue
              lines.append(f"Checkpoint {look['look']} used bar {look['bar']:.2f} (planned {look['planned_bar']:.2f}), "
                           "by the spending rule of section 11.7. Log it in the Amendments table.")
          print(" ".join(lines))
          EOF
          )
          rm -f "$record"
          if [ -z "$message" ]; then
            echo "fund test bar tonight: no look read tonight, or its bar is the planned one"
            exit 0
          fi
          echo "fund test bar tonight: $message"
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          MESSAGE="$message" python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"],
                            "title": "⚠️ Fund test bar differs from the plan",
                            "message": os.environ["MESSAGE"],
                            "priority": 4, "tags": ["warning"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

  funds-failed:
    # A shadow funds run that ends red sends nothing itself (it holds no
    # secret), and the push job above runs only after a green one -- so a
    # night with no funds record also has no shekel rate table, and nothing
    # would say so (the owner, 3 Oct 2026: "alert me if it failed"). Fixed
    # words and the failed run's link; nothing from the run is read.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'shadow funds' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell the owner's phone the funds run failed
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"],
                            "title": "⚠️ The shadow funds run failed tonight",
                            "message": ("Tonight's shadow funds run did not finish, so the race gate, the 4 Funds "
                                        "page and the after-tax report keep the last night's numbers, and no "
                                        "shekel rate table was kept. Nothing is traded. Open the run to see why."),
                            "priority": 3, "tags": ["warning"], "click": os.environ["RUN_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac

