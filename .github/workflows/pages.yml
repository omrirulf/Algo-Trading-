name: pages

# The desk on the owner's phone, without a Claude session in the loop.
#
# dashboard/build.py embeds logs/book.json into the page and copies the
# manifest, the service worker and the icons beside it; this deploys the
# result to GitHub Pages. Opened once in the phone's browser and added to
# the home screen, it is an app: full screen, its own icon, and the last
# snapshot readable offline. Online it reads the live snapshot straight
# from the public repository, so a redeploy is only needed for the page
# itself and for a fresh built-in copy.
#
# Runs after every journal commit (logs/book.json changes) and after any
# change to the page. Nothing here needs a credential: the site is static
# and the repository is public.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "logs/book.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write           # only to push the built site to the gh-pages branch

# One deploy at a time; a newer one waits rather than cancels, so the page
# that lands is always the newest snapshot.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and publish the site to the gh-pages branch
        # dashboard/publish.sh: the standard library only, one commit on
        # gh-pages, rewritten each time. A branch rather than the Pages
        # deploy action, because the job's own token may not create the
        # Pages site, and a gh-pages branch is the one publishing source
        # GitHub turns on by itself. The heartbeat runs the same script
        # after every journal commit, because its own push cannot start
        # this workflow.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dashboard/publish.sh

      - name: Say where the site is
        # Advisory: prints the Pages address when the site is enabled, and
        # says what to click when it is not. Never fails the job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '"Pages is on: " + .html_url + " (source: " + .source.branch + ")"' 2>/dev/null; then
            exit 0
          fi
          echo "::notice::Pages is not enabled yet. In the repository Settings → Pages, set the source to the gh-pages branch (root); the site then publishes from this branch on every push."
