name: universe news check

# Does the news search find the company? (The card's replacement rule (2),
# 3 Oct 2026.) Production searches Google News for "<ticker> stock"
# (orchestrator/news.py). For a ticker whose letters are also the usual name of
# something else in market news, the headlines the model reads would be about
# that something else. This job asks the same search for a few names of the
# shadow stock universe -- the replacements and the tickers that are also
# common words -- and prints, per name, how many of its headlines name the
# company, and the first headlines themselves (public news; nothing is kept).
#
# It holds the Bright Data token and zone the cycle uses and nothing else: no
# broker key, no model key; it commits nothing. About 20 requests, about $0.03.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/universe-news-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: What does "<ticker> stock" find?
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_SERP_ZONE: ${{ vars.BRIGHTDATA_SERP_ZONE }}
        run: |
          python - <<'EOF'
          import re
          from orchestrator.heartbeat import fetch_news
          # Ticker -> words that show a headline is about the company.
          NAMES = {
              "STT": r"State Street", "TROW": r"T\. ?Rowe", "AON": r"\bAon\b", "IRM": r"Iron Mountain",
              "EW": r"Edwards", "IDXX": r"IDEXX", "MET": r"MetLife", "MLM": r"Martin Marietta",
              "UMC": r"United Microelectronics|\bUMC\b",
              "ICE": r"Intercontinental|\bNYSE\b", "NOW": r"ServiceNow", "SO": r"Southern Co",
              "ED": r"Con(solidated)? ?Ed", "O": r"Realty Income", "T": r"AT&T", "V": r"\bVisa\b",
              "C": r"\bCiti", "F": r"\bFord\b", "D": r"Dominion",
          }
          for ticker, pattern in NAMES.items():
              try:
                  items = fetch_news(ticker)
              except Exception as exc:  # one name must not end the check
                  print(f"{ticker:<5} news fetch failed: {type(exc).__name__}")
                  continue
              # A headline counts when its title or snippet names the company.
              hits = sum(1 for h in items if re.search(pattern, h.as_line(), re.I))
              print(f"{ticker:<5} {hits} of {len(items)} headlines name the company")
              for h in items[:5]:
                  print(f"      - {h.title[:140]}")
          EOF
