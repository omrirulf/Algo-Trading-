name: article probe

# One recorded context, with the articles behind its search results fetched
# and handed to the model: a feel for what full article text would add before
# anything is built. See docs/article-probe.mdx and replay/article_probe.py.
#
# It fetches each result page through the Web Unlocker zone the news fetch
# already uses and cuts the story out with a generic extractor; optionally it
# also runs a Scraper Studio scraper for one site -- one it builds itself
# through Scraper Studio's API (build_scraper), or an existing one by its
# trigger URL -- to compare the two on the same pages. Then it asks the production model the same context with
# and without the article text, each prompt twice, and reports words, tokens,
# cost and answers.
#
# It costs a little: about a dozen Unlocker requests, the scraper's records
# if one is given, and up to twelve model calls at the production price (a
# fifth of a cent each). It never trades and holds no broker key.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "The site the scraper covers, and the one a line is picked for"
        default: "finance.yahoo.com"
      ticker:
        description: "Probe this single stock's line (blank: the latest with 2+ articles on the site)"
        default: ""
      day:
        description: "YYYY-MM-DD: probe a line journalled that day (blank: any)"
        default: ""
      words:
        description: "Words of each article the model gets"
        default: "300"
      repeats:
        description: "Times each prompt is asked"
        default: "2"
      scraper_trigger:
        description: "Reuse a scraper: its trigger URL (https://api.brightdata.com/dca/trigger?collector=c_...); blank uses vars.BRIGHTDATA_SCRAPER_TRIGGER"
        default: ""
      build_scraper:
        description: "Have Scraper Studio's AI build a scraper for the site first (leaves a collector in the account); ignored when a trigger is given"
        type: boolean
        default: false
      scraper_collector:
        description: "Build on this existing collector (c_...) instead of creating one: a failed build's leftover is finished, a built one used as it is"
        default: ""
      ask_model:
        description: "Ask the model (off: fetch and measure only)"
        type: boolean
        default: true
  # workflow_dispatch does not exist until this file is on main, and the probe
  # exists to inform whether to go further -- so, like baseline-compare.yml,
  # it also runs on its own pull request, and only when it changes.
  pull_request:
    paths:
      - replay/article_probe.py
      - .github/workflows/article-probe.yml

permissions:
  contents: read

jobs:
  probe:
    # A pull request from a fork gets no secrets, so there is nothing to probe with.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Worst case, every wait at its limit: ten pages at 90s each, four at a
    # time and doubled for Google redirects (~9 min), a scraper build's
    # 15-minute deadline, the scraper's 10-minute deadline, and up to twelve
    # model calls four at a time at 300s plus one retry each (~30 min).
    # tests/test_article_probe.py derives this from the constants, so raising
    # one without the other fails there.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      # trafilatura is the probe's article extractor and nothing else uses it,
      # so it is installed here rather than added to requirements.txt.
      - run: pip install -r requirements.txt trafilatura==2.0.0

      - name: Fetch one context's articles and ask the model with and without them
        # The Bright Data token and zone the news fetch uses, and the key
        # chain the cycle resolves the full model's token through -- so the
        # pages come through the production zone and the answers from the
        # production call. No broker key: the probe cannot trade.
        #
        # Inputs reach the script as environment variables, never pasted
        # into the shell, and stdout (the JSON record) is kept apart from
        # stderr (the report a person reads).
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_SERP_ZONE: ${{ vars.BRIGHTDATA_SERP_ZONE }}
          FULL_MODEL_API_KEY: ${{ secrets.FULL_MODEL_API_KEY || secrets.DEEPINFRA_API_KEY || secrets.SCREENING_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GROQ_API_KEY }}
          SITE: ${{ inputs.site }}
          TICKER: ${{ inputs.ticker }}
          DAY: ${{ inputs.day }}
          WORDS: ${{ inputs.words }}
          REPEATS: ${{ inputs.repeats }}
          SCRAPER_TRIGGER: ${{ inputs.scraper_trigger || vars.BRIGHTDATA_SCRAPER_TRIGGER }}
          ASK_MODEL: ${{ inputs.ask_model }}
          # Blank on a pull_request run, which never builds a scraper: a build
          # leaves a collector in the account, so it is asked for by name.
          BUILD_SCRAPER: ${{ inputs.build_scraper }}
          SCRAPER_COLLECTOR: ${{ inputs.scraper_collector }}
        run: |
          args=(--json)
          [ -n "$SITE" ] && args+=(--site "$SITE")
          [ -n "$TICKER" ] && args+=(--ticker "$TICKER")
          [ -n "$DAY" ] && args+=(--day "$DAY")
          [ -n "$WORDS" ] && args+=(--words "$WORDS")
          [ -n "$REPEATS" ] && args+=(--repeats "$REPEATS")
          [ -n "$SCRAPER_TRIGGER" ] && args+=(--scraper-trigger "$SCRAPER_TRIGGER")
          [ "$BUILD_SCRAPER" = "true" ] && args+=(--build-scraper)
          [ -n "$SCRAPER_COLLECTOR" ] && args+=(--collector "$SCRAPER_COLLECTOR")
          # Blank on a pull_request run, which asks the model like a dispatch does.
          [ "$ASK_MODEL" = "false" ] && args+=(--no-model)
          status=0
          python replay/article_probe.py "${args[@]}" \
            > "$RUNNER_TEMP/probe.json" 2> "$RUNNER_TEMP/probe.txt" || status=$?
          cat "$RUNNER_TEMP/probe.txt"
          exit $status

      - name: Publish the probe to the run summary
        if: always()
        run: |
          {
            echo '## One context, with its articles'
            echo
            echo '```'
            cat "$RUNNER_TEMP/probe.txt" 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep everything it read and said
        # The prompts as sent, each article's text and the scraper's records:
        # the report is a summary, and reading what the model read is the point.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: article-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/probe.json
            ${{ runner.temp }}/probe.txt
          retention-days: 30
