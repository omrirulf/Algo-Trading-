name: shadow funds smoke

# Does the fund machinery hold on the real journal and real prices?
#
# The tests run the shadow funds on made-up bars and made-up lines. This runs
# them the way the nightly job will -- the journal as the heartbeat wrote it,
# the paper account's own short refusals, yfinance's final closes -- through
# the production engine and position manager on simulated books, over the
# last 15 final sessions, and goes red if any fund hits an integrity problem:
# an unexpected engine error, a position-manager error, a position its stops
# do not cover, a line that reached the live audit log.
#
# It prints health counts only (orders accepted and refused, fills by kind,
# open positions), never an equity, a return or a comparison between funds:
# those belong to the fund test, from its start date.
#
# NO credential of any kind, and read-only: CI enforces that shadow/ cannot
# reach a broker, read a key or write a file.
on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Final sessions to run"
        default: "15"
  # On a pull request that changes the machinery the funds run, for the
  # reason horse-race.yml states: workflow_dispatch does not exist until the
  # file reaches the default branch.
  pull_request:
    paths:
      - "shadow/**"
      - "app/execution_engine.py"
      - "app/position_manager.py"
      - "app/risk_engine.py"
      - "app/market_data.py"
      - "config/settings.py"
      - "rules/**"
      - "analysis/reader.py"
      - "analysis/baseline_compare.py"
      - ".github/workflows/funds-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: The four funds and 20 coin-flip funds on the real journal
        env:
          SESSIONS: ${{ inputs.sessions || '15' }}
        run: |
          case "$SESSIONS" in (*[!0-9]*|'') echo "sessions must be a number"; exit 2;; esac
          python -m shadow.smoke --sessions "$SESSIONS" --random 20
