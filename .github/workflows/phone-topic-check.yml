name: phone topic check

# Is the phone topic long and random? (the owner, 3 Oct 2026.) The pushes go
# through the public server ntfy.sh, where anyone who knows a topic's name can
# read and send (docs/phone.mdx), so the name in the NTFY_TOPIC secret is the
# only protection until the notifications move to a private channel (docs,
# "Before real money").
#
# This job reads that one secret and prints only the verdict -- never the
# name, its length or any part of it. The log is public, so a weak name's
# failing tests are not listed; a passing name lists every test as yes. It
# asks no model, holds no other key and commits nothing. A weak name is a warning, not a red check:
# only the owner can choose a new name (in the ntfy app and in the secret).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/phone-topic-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the topic long and random?
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'EOF'
          import math, os, re
          topic = os.environ.get("NTFY_TOPIC", "")
          if not topic:
              print("::warning::NTFY_TOPIC is not set (or this run cannot see it): nothing to check")
              raise SystemExit
          # A readable prefix such as "algo-desk-" is allowed; the strength is in the rest.
          tail = re.sub(r"^(?:[A-Za-z][A-Za-z0-9]*[-_])+", "", topic)
          # Length cannot tell a word or a year from random characters, so look for the usual ones.
          words = ("algo", "trad", "alert", "desk", "phone", "ntfy", "stock", "money", "topic", "notif",
                   "push", "test", "pass", "secret", "admin", "market", "invest", "signal")
          guessable = bool(re.search(r"(?:19|20)\d\d", tail)) or any(w in tail.lower() for w in words)
          classes = [bool(re.search(p, tail)) for p in ("[a-z]", "[A-Z]", "[0-9]")]
          alphabet = 26 * classes[0] + 26 * classes[1] + 10 * classes[2] + (10 if re.search(r"[^A-Za-z0-9]", tail) else 0)
          bits = len(tail) * math.log2(alphabet) if alphabet else 0.0
          most = max(tail.count(c) for c in set(tail)) if tail else 0
          tests = {
              "only what ntfy accepts (A-Z a-z 0-9 - _, at most 64)": re.fullmatch(r"[-_A-Za-z0-9]{1,64}", topic) is not None,
              "at least 20 characters in all": len(topic) >= 20,
              "at least 12 characters after any readable prefix": len(tail) >= 12,
              "letters and digits mixed in that part": (classes[0] or classes[1]) and classes[2],
              "no character makes up more than a quarter of that part": bool(tail) and most <= len(tail) / 4,
              "at least 60 bits of guessing (length x alphabet)": bits >= 60,
              "no year and no common word after the prefix": not guessable,
          }
          if all(tests.values()):
              for name in tests:
                  print(f"yes  {name}")
              print("The phone topic passes the length and pattern checks. They cannot prove a name is random: "
                    "if it was typed by hand rather than generated, replace it with a generated one.")
          else:
              # The log is public: which test failed is not said.
              print("::warning::The phone topic does not pass the length and pattern checks: choose a new, "
                    "generated one (docs/phone.mdx) in the ntfy app and in the NTFY_TOPIC secret")
          EOF
