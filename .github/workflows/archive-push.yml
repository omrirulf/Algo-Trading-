name: archive-push

# Push the journal and the audit log to the Supabase archive, by hand.
#
# The heartbeat does this after every cycle ("Push the archive to Supabase").
# This exists for the moments between cycles: to prove a new or rotated
# SUPABASE_SERVICE_KEY works the day it is set rather than on the next trading
# day, and to backfill an empty project (the first push of an empty remote
# sends everything, because it has no watermark). The push is idempotent --
# rows are keyed on a content hash and a re-send is ignored -- so running this
# at any time, as often as you like, changes nothing that is already there.
#
# It also re-sends a heartbeat run's model calls (model_io_run): every
# heartbeat keeps its capture of the day's model calls as a 90-day artifact
# ("Keep the day's model calls as an artifact"), and when that run's own
# upload to Storage failed, this downloads the artifact and pushes it again.
# Idempotent too: rows are keyed on the call id, and an object already in
# the bucket is left as it is.
#
# It prints only the push's own summary and the short status record
# (last_attempt, last_success, ok, a reason such as "HTTP 401", and how many
# model-call records were withheld as credential-shaped), never the key:
# store/remote.py sends it on the apikey header and nowhere else.
#
# Writes nothing back to the repository, and holds no other credential.
on:
  workflow_dispatch:
    inputs:
      model_io_run:
        description: "A heartbeat run id whose model-call artifact to push again (blank: none)"
        default: ""
      model_io_attempt:
        description: "That run's attempt number (the artifact is model-io-<run>-<attempt>)"
        default: "1"

concurrency:
  group: archive-push
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # only to download a heartbeat run's model-call artifact

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the run to re-send
        if: inputs.model_io_run != ''
        env:
          RUN: ${{ inputs.model_io_run }}
          ATTEMPT: ${{ inputs.model_io_attempt }}
        run: |
          case "$RUN" in (*[!0-9]*|'') echo "model_io_run must be a run id (digits)"; exit 2;; esac
          case "$ATTEMPT" in (*[!0-9]*|'') echo "model_io_attempt must be a number"; exit 2;; esac

      - name: Download that run's model calls
        if: inputs.model_io_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: model-io-${{ inputs.model_io_run }}-${{ inputs.model_io_attempt }}
          path: logs/model_io
          run-id: ${{ inputs.model_io_run }}
          github-token: ${{ github.token }}

      - name: Push the archive to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          python store/push_remote.py --status "$RUNNER_TEMP/archive_status.json"
          code=$?
          set -e
          echo "## Archive push" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/archive_status.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/archive_status.json"
            cat "$RUNNER_TEMP/archive_status.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          # A push that did not happen is not a green run here: this workflow
          # exists to prove the secrets work, and "not configured" exits 0
          # (the heartbeat treats it as a daily warning, not a failure).
          if [ "$code" = "0" ] && ! python -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('ok') is True else 1)" "$RUNNER_TEMP/archive_status.json"; then
            echo "::error::the archive push did not succeed (see the status above)"
            exit 1
          fi
          exit "$code"
