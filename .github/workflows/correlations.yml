name: correlations

# What actually moves together on this watchlist, measured rather than
# assumed. EXPOSURE_GROUPS is a set of hypotheses about correlation; this
# job is the only thing that checks them against prices.
#
# It runs here rather than anywhere else for one boring reason: yfinance
# needs the open internet, and a runner has it. No credential of any kind is
# used -- yfinance is unauthenticated and no broker key is passed -- so
# nothing in this job can trade, and `analysis/` cannot write a file or reach
# an order path at all (CI enforces both). The report goes to stdout, the
# workflow captures it.
#
# Nothing downstream consumes the output automatically. A finding is promoted
# into EXPOSURE_GROUPS or EXPOSURE_GROUP_CAP_OVERRIDES by a person, in a pull
# request, with the measured number written into the comment beside it --
# the same posture BLEND_MODE=shadow takes for the learned blend.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "How much history to fetch"
        default: "3"
      tickers:
        description: "Comma-separated override of the watchlist (default: all)"
        default: ""

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Measure
        run: |
          set -o pipefail
          ARGS="--years ${{ inputs.years }}"
          if [ -n "${{ inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ inputs.tickers }}"
          fi
          python -m analysis.correlations $ARGS | tee correlations.txt
          python -m analysis.correlations $ARGS --json > correlations.json

      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Correlations'
            echo
            echo '```'
            cat correlations.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: correlations
          path: |
            correlations.txt
            correlations.json
