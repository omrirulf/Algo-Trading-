name: correlations

# What actually moves together on this watchlist, measured rather than
# assumed. EXPOSURE_GROUPS is a set of hypotheses about correlation; this
# job is the only thing that checks them against prices.
#
# It runs here rather than anywhere else for one boring reason: yfinance
# needs the open internet, and a runner has it. No credential of any kind is
# used -- yfinance is unauthenticated and no broker key is passed -- so
# nothing in this job can trade, and `analysis/` cannot write a file or reach
# an order path at all (CI enforces both). The report goes to stdout, the
# workflow captures it.
#
# Nothing downstream consumes the output automatically. A finding is promoted
# into EXPOSURE_GROUPS or EXPOSURE_GROUP_CAP_OVERRIDES by a person, in a pull
# request, with the measured number written into the comment beside it --
# the same posture BLEND_MODE=shadow takes for the learned blend.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day to fetch (2007-01-01 reaches the 2008 crisis)"
        default: "2007-01-01"
      tickers:
        description: "Comma-separated override of the watchlist (default: all)"
        default: ""
  # Also on a pull request that changes the measurement itself. Two reasons:
  # a change to how correlation is computed should be reviewed against its
  # own output rather than in the abstract, and workflow_dispatch does not
  # exist until the file reaches the default branch -- so without this the
  # first run could only happen after merge, which is the wrong order for
  # something whose entire purpose is to inform a decision.
  pull_request:
    paths:
      - "analysis/correlations.py"
      - "analysis/volatility.py"
      - ".github/workflows/correlations.yml"
      - "config/instruments.py"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Measure
        env:
          # Defaulted here rather than in the `run` line so the pull_request
          # trigger, which supplies no inputs at all, still reaches 2008.
          START: ${{ inputs.start || '2007-01-01' }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          set -o pipefail
          ARGS="--start $START"
          if [ -n "$TICKERS" ]; then
            ARGS="$ARGS --tickers $TICKERS"
          fi
          # logs/book.json is committed by the heartbeat after every cycle,
          # so this adds the joint-stress section for the account that
          # actually exists, on top of the watchlist-wide measurement. Its
          # absence (a fresh checkout before the first cycle ever ran) is
          # not an error -- the section is simply omitted, same as any other
          # ticker this module could not get data for.
          if [ -f logs/book.json ]; then
            ARGS="$ARGS --book logs/book.json"
          fi
          python -m analysis.correlations $ARGS | tee correlations.txt
          python -m analysis.correlations $ARGS --json > correlations.json

      - name: Measure the VIX regimes
        # Separate step, same job: it needs the same network and the same
        # twenty years, but answers a different question -- whether leaning
        # into fear pays, and what a trade already risks in that regime.
        env:
          START: ${{ inputs.start || '2007-01-01' }}
        run: |
          set -o pipefail
          python -m analysis.volatility --start "$START" | tee volatility.txt
          python -m analysis.volatility --start "$START" --json > volatility.json

      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '## Correlations'
            echo
            echo '```'
            cat correlations.txt 2>/dev/null || echo "(did not run)"
            echo '```'
            echo
            echo '## VIX regimes'
            echo
            echo '```'
            cat volatility.txt 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: correlations
          path: |
            correlations.txt
            correlations.json
            volatility.txt
            volatility.json
