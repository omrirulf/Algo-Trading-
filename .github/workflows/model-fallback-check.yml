name: model fallback check

# Does the second host for the full model answer production's question?
# The owner's fallback of 17 Nov 2026 (orchestrator/llm.py,
# FallbackSignalProvider): when the configured host cannot answer at all,
# the same model is asked at FALLBACK_MODEL_BASE_URL. That host is asked
# only while the secret FULL_MODEL_FALLBACK_API_KEY is set, and this is the
# one ask to make by hand after adding the secret and before relying on it.
# See replay/model_fallback_check.py.
#
# It costs one model ask or a few (a cent or so each) and reads one
# artifact. It never trades, writes no journal and holds no broker key.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many archived production asks to send (distinct names)"
        default: "1"
      workers:
        description: "How many at a time (production asks four at a time)"
        default: "4"

permissions:
  contents: read
  actions: read   # only to download a production run's model calls

jobs:
  check:
    runs-on: ubuntu-latest
    # A few asks four at a time, each up to the 480-second ceiling with its
    # one transport retry and up to three busy waits.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download the latest production run's model calls
        # heartbeat.yml keeps each run's model calls as the artifact
        # model-io-<run>-<attempt>; the latest completed run that has one (a
        # protection pass has none). Best effort: without an archive the
        # check asks its built-in question instead.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=""
          for candidate in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow heartbeat.yml --status completed --limit 12 --json databaseId --jq '.[].databaseId'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '.artifacts[].name' | grep -q "^model-io-$candidate-"; then
              id="$candidate"
              break
            fi
          done
          case "$id" in (*[!0-9]*|"") echo "no production run with model calls found; the built-in question will be asked"; exit 0;; esac
          echo "production run $id"
          mkdir -p "$RUNNER_TEMP/model_io"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern "model-io-$id-*" --dir "$RUNNER_TEMP/model_io"

      - name: Ask the fallback host production's question
        # The second host's key and nothing else: not the configured host's,
        # not the broker's, not the phone's. The inputs reach the script as
        # variables, never as shell text.
        env:
          FULL_MODEL_FALLBACK_API_KEY: ${{ secrets.FULL_MODEL_FALLBACK_API_KEY }}
          COUNT: ${{ inputs.count }}
          WORKERS: ${{ inputs.workers }}
        run: |
          status=0
          python replay/model_fallback_check.py --model-io "$RUNNER_TEMP/model_io" \
            --count "${COUNT:-1}" --workers "${WORKERS:-4}" > "$RUNNER_TEMP/check.txt" || status=$?
          cat "$RUNNER_TEMP/check.txt"
          {
            echo "## Model fallback check"
            echo
            echo '```'
            cat "$RUNNER_TEMP/check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
