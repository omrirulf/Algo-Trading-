name: screening check

# Does the screening endpoint actually reach the cycle?
#
# Run by hand, because the answer only changes when a secret or a variable
# changes. Every way this configuration goes wrong is silent -- a key under a
# name nothing reads, a key with no endpoint behind it, an endpoint that will
# not honour strict json_schema -- and all three look exactly like "screening
# is off", which is a legitimate state. So this asks out loud.
#
# It never prints a key. One request against the configured endpoint, a
# fraction of a cent. No orders, no journal, no trading.

on:
  workflow_dispatch:
    inputs:
      recall:
        description: "Also grade the endpoint against the recorded Haiku screen (makes real calls)"
        type: boolean
        default: false
      limit:
        description: "Journal lines to grade against"
        default: "200"
      concurrency:
        description: "Calls in flight at once. Lower it if the report blames 429s on us."
        default: "8"
      base_url:
        description: "Endpoint to test. Blank uses the SCREENING_BASE_URL variable."
        default: ""
      model:
        description: "Model to ask it for. Blank uses the SCREENING_MODEL variable."
        default: ""
      key:
        description: "Which stored secret to send. Blank resolves the usual chain."
        type: choice
        options: ["", "SCREENING_API_KEY", "GEMINI_API_KEY", "GOOGLE_API_KEY", "GROQ_API_KEY"]
        default: ""
      effort:
        description: "Grade with reasoning ON at this effort (a proposal, not what the screen does today). Blank = as the cycle asks."
        type: choice
        options: ["", "low", "medium", "high"]
        default: ""

permissions:
  contents: read

jobs:
  screening:
    runs-on: ubuntu-latest
    # Sized for the slowest thing this job can be asked to do, which is a
    # graded run at high effort -- not the probe, and not the cheap grading.
    #
    # The probe is one call and a few seconds. Grading is one call per journal
    # line, sequentially: about eight minutes at the ~2.4s a hosted endpoint
    # answers the screen in, and several times that once `effort` turns
    # reasoning on and each answer carries thousands of thinking tokens.
    #
    # This has already been got wrong once in the cheap direction: at the 10
    # minutes it carried from when it only ran the probe, the first real
    # grading run was killed at 9m29s, one step before printing the number,
    # having paid for every call. tests/test_workflow_keys.py pins the
    # requirement to the slow case for that reason.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Is the screening endpoint wired, and does it answer
        # Every spelling is passed through so the probe can say which one
        # carried the key -- the same reason data-sources.yml passes all of
        # EIA_KEY, EIA_TOKEN and EIA_API_KEY. The cycle itself collapses these
        # onto SCREENING_API_KEY; here they stay separate so the report can
        # name the one that is actually set.
        env:
          # An input overrides the variable, so a candidate can be graded
          # without touching what production reads. Editing the live variables
          # to run a test is how a screen measured at 5% recall came within
          # hours of deciding real trades.
          SCREENING_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || vars.SCREENING_BASE_URL }}
          SCREENING_MODEL: ${{ inputs.model != '' && inputs.model || vars.SCREENING_MODEL }}
          # Naming a key passes that one alone, so the probe still reports
          # which spelling carried it. Blank passes all four and lets the
          # usual chain decide -- which is what production does, and what a
          # run with no override should therefore measure.
          SCREENING_API_KEY: ${{ (inputs.key == '' || inputs.key == 'SCREENING_API_KEY') && secrets.SCREENING_API_KEY || '' }}
          GEMINI_API_KEY: ${{ (inputs.key == '' || inputs.key == 'GEMINI_API_KEY') && secrets.GEMINI_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ (inputs.key == '' || inputs.key == 'GOOGLE_API_KEY') && secrets.GOOGLE_API_KEY || '' }}
          GROQ_API_KEY: ${{ (inputs.key == '' || inputs.key == 'GROQ_API_KEY') && secrets.GROQ_API_KEY || '' }}
        run: |
          set -o pipefail
          python backtest/probe_screening.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Does it agree with the screen it would replace
        # The probe above proves the endpoint answers. This proves it answers
        # the same way, which is the only question that decides whether the
        # saving is real or is a quietly worse funnel. Opt-in because it makes
        # one call per journal line -- a few cents at the documented rates,
        # against the probe's one call.
        #
        # Gated on the probe passing: grading an endpoint that cannot answer
        # produces a page of identical errors and no information.
        if: inputs.recall
        env:
          SCREENING_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || vars.SCREENING_BASE_URL }}
          SCREENING_MODEL: ${{ inputs.model != '' && inputs.model || vars.SCREENING_MODEL }}
          SCREENING_API_KEY: ${{ inputs.key == 'GEMINI_API_KEY' && secrets.GEMINI_API_KEY || inputs.key == 'GOOGLE_API_KEY' && secrets.GOOGLE_API_KEY || inputs.key == 'GROQ_API_KEY' && secrets.GROQ_API_KEY || secrets.SCREENING_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          python replay/compare_screening.py \
            --base-url "$SCREENING_BASE_URL" \
            --model "$SCREENING_MODEL" \
            --api-key "$SCREENING_API_KEY" \
            --limit "${{ inputs.limit }}" \
            --concurrency "${{ inputs.concurrency }}" \
            ${{ inputs.effort && format('--effort {0}', inputs.effort) || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"
