name: determinism check

# Does this configuration agree with ITSELF?
#
# Run by hand. compare_models.py measures agreement between two DIFFERENT
# configurations on the same recorded contexts; this measures agreement
# between ONE configuration and its own repeated answer to the identical
# question. A candidate that looks noisy against the incumbent may just be
# noisy, period -- this is the baseline that number has to be read against.
#
# No orders, no journal written, same as every other replay/ tool.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to test against itself, e.g. openai/gpt-oss-120b or claude-opus-5"
        required: true
      effort:
        description: "Reasoning effort to ask it for (blank asks with reasoning off)"
        default: ""
      provider:
        description: "Which endpoint to ask. 'claude' uses ANTHROPIC_API_KEY and ignores base_url."
        type: choice
        options: ["openai-compatible", "claude"]
        default: "openai-compatible"
      base_url:
        description: "OpenAI-compatible endpoint (ignored when provider is 'claude')"
        default: "https://api.deepinfra.com/v1/openai"
      limit:
        description: "Distinct contexts to test. Total calls = limit x repeats."
        default: "30"
      repeats:
        description: "Times each context is asked (at least 2)"
        default: "5"
      concurrency:
        description: "Calls in flight at once, base_url only. Lower it if the run blames timeouts or 429s on us."
        default: "4"
      timeout:
        description: "Per-call timeout, seconds"
        default: "120"

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    # limit x repeats calls, each up to a reasoning effort's latency -- the
    # same reasoning as screening-check.yml and model-compare.yml: a cheap
    # deadline on the JOB (as opposed to the per-call --timeout above) would
    # decide which contexts get graded by which ones finished in time.
    #
    # 90 was too tight to be comfortable: the first real run of the defaults
    # (150 calls, 4 at a time) took 80 minutes of it. The report prints only
    # once every call is back, so overrunning loses the whole run rather than
    # truncating it, and a 10-minute margin is not one. GitHub allows six
    # hours; this takes a little under half of one.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Does this model agree with itself
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_KEY: ${{ secrets.SCREENING_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          # An empty workflow_dispatch input is treated by GitHub as "not
          # supplied" and replaced by the declared default, so passing
          # base_url="" could not mean "ask Claude" -- it silently meant
          # "ask DeepInfra". That sent a claude-* model name to an endpoint
          # that does not serve it and failed all 100 calls of the first
          # real run. The provider choice is what carries that intent now,
          # because a choice input cannot collapse into a default this way.
          BASE_URL=""
          if [ "${{ inputs.provider }}" != "claude" ]; then
            BASE_URL="${{ inputs.base_url }}"
          fi
          python replay/determinism_check.py \
            --base-url "$BASE_URL" \
            --model "${{ inputs.model }}" \
            --effort "${{ inputs.effort }}" \
            --api-key "$CANDIDATE_KEY" \
            --limit "${{ inputs.limit }}" \
            --repeats "${{ inputs.repeats }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --timeout "${{ inputs.timeout }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
