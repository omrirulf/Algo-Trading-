name: phone test

# One button that proves the phone is connected: sends a test notification
# to the ntfy topic in the NTFY_TOPIC secret and nothing else. No cycle, no
# broker, no model. Run it from the Actions tab after subscribing the phone
# and storing the secret; a notification within seconds means every push
# the cycle sends will arrive the same way.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Push a test message to the owner's phone
        # Same shape as the cycle's push: the topic only in the JSON body,
        # never in a URL or a log; the file that carried it removed; the
        # job told plainly when the secret is unset.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DESK_URL: https://omrirulf.github.io/Algo-Trading-/
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::error::no phone configured (NTFY_TOPIC secret unset); nothing sent"
            exit 0
          fi
          python - <<'EOF' > "$RUNNER_TEMP/phone.json"
          import json, os, datetime
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          print(json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "🟢 Phone connected",
                            "message": "The trading desk can reach this phone. Sent by the phone-test workflow at " + now + ". The daily brief and any alarm will arrive here.",
                            "priority": 3, "tags": ["white_check_mark"], "click": os.environ["DESK_URL"]}))
          EOF
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                 --data-binary @"$RUNNER_TEMP/phone.json" https://ntfy.sh/ || echo "000")
          rm -f "$RUNNER_TEMP/phone.json"
          case "$code" in
            2*) echo "phone notified (HTTP $code)";;
            *)  echo "::warning::phone not notified (HTTP $code)";;
          esac
